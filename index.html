<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Velora Studio — Enterprise Edition v7.0</title>
<style>
:root{
  --bg:#06060a; --panel:#0a0a10;
  --card-1:#26262f; --card-2:#1a1a22; --card-3:#0e0e14;
  --border:#2e2e3a; --border-2:#444452;
  --text:#eef0f4; --muted:#8e8e9a; --muted-2:#5e5e68;
  --green:#56d488; --blue:#66b0ee; --red:#f06a6a;
  --amber:#e8b854; --purple:#a889e8; --gold:#f4d99b;
  --topbar-h:52px; --sidebar-w:170px; --bottom-h:30px;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{background:var(--bg);color:var(--text);font-family:"Segoe UI","SF Pro Text",system-ui,Arial,sans-serif;font-size:13px;overflow:hidden;-webkit-font-smoothing:antialiased;}
::-webkit-scrollbar{width:9px;height:9px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:linear-gradient(180deg,#3a3a48,#1e1e28);border-radius:5px;border:1px solid #2a2a34;transition:background .3s;}
::-webkit-scrollbar-thumb:hover{background:linear-gradient(180deg,#4a4a5a,#2a2a34);}
button{font-family:inherit;cursor:pointer;}

@keyframes pageEnter{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:translateY(0);}}
@keyframes cardEnter{0%{opacity:0;transform:translateY(22px) scale(.98);}100%{opacity:1;transform:translateY(0) scale(1);}}
@keyframes rowEnter{from{opacity:0;transform:translateX(-10px);}to{opacity:1;transform:translateX(0);}}
@keyframes rippleGo{to{transform:scale(4);opacity:0;}}
@keyframes loadSlide{0%{width:0;left:0;}50%{width:65%;left:17%;}100%{width:0;left:100%;}}
@keyframes toastIn{from{opacity:0;transform:translateX(110%) scale(.9);}to{opacity:1;transform:translateX(0) scale(1);}}
@keyframes toastOut{to{opacity:0;transform:translateX(110%) scale(.9);}}
@keyframes modalPop{0%{opacity:0;transform:scale(.92) translateY(14px);}60%{opacity:1;transform:scale(1.01) translateY(-2px);}100%{opacity:1;transform:scale(1) translateY(0);}}
@keyframes modalOut{to{opacity:0;transform:scale(.96) translateY(8px);}}
@keyframes barGrow{from{height:0 !important;opacity:.3;filter:blur(4px);}to{opacity:1;filter:blur(0);}}
@keyframes focusPulse{0%{box-shadow:inset 0 2px 4px rgba(0,0,0,.6),0 0 0 0 rgba(232,184,84,.5);}100%{box-shadow:inset 0 2px 4px rgba(0,0,0,.6),0 0 0 3px rgba(232,184,84,.15);}}
@keyframes successPulse{0%{transform:scale(0) rotate(-45deg);opacity:0;}60%{transform:scale(1.2) rotate(0deg);}100%{transform:scale(1) rotate(0deg);opacity:1;}}
@keyframes spin360{from{transform:rotate(0);}to{transform:rotate(360deg);}}
@keyframes toastProgress{from{width:100%;}to{width:0;}}
@keyframes sendingDot{0%,80%,100%{opacity:.3;transform:translateY(0);}40%{opacity:1;transform:translateY(-3px);}}
@keyframes splashFade{0%{opacity:0;transform:scale(.9);}20%{opacity:1;transform:scale(1);}80%{opacity:1;}100%{opacity:0;transform:scale(1.05);}}
@keyframes obFadeOut{to{opacity:0;visibility:hidden;}}
@keyframes obStepIn{from{opacity:0;transform:translateX(24px);}to{opacity:1;transform:translateX(0);}}
@keyframes kpiEnter{0%{opacity:0;transform:translateY(24px) scale(.94);}60%{opacity:1;transform:translateY(-2px) scale(1.01);}100%{opacity:1;transform:translateY(0) scale(1);}}
@keyframes navEnter{0%{opacity:0;transform:translateX(-20px);}100%{opacity:1;transform:translateX(0);}}
@keyframes subEnter{0%{opacity:0;transform:translateX(-12px);}100%{opacity:1;transform:translateX(0);}}
@keyframes iconBounce{0%,100%{transform:translateY(0) rotate(0);}30%{transform:translateY(-4px) rotate(-8deg);}60%{transform:translateY(-1px) rotate(4deg);}}
@keyframes logoPop{0%{transform:scale(1);}50%{transform:scale(1.12);}100%{transform:scale(1);}}
@keyframes amberGlow{0%,100%{box-shadow:0 0 0 0 rgba(232,184,84,.35);}50%{box-shadow:0 0 20px 4px rgba(232,184,84,.12);}}
@keyframes shimmer{0%{background-position:-200% 0;}100%{background-position:200% 0;}}
@keyframes floatUp{0%{opacity:0;transform:translateY(16px);}100%{opacity:1;transform:translateY(0);}}
@keyframes tabSlide{0%{transform:translateX(-100%);}100%{transform:translateX(0);}}
@keyframes pulseSoft{0%,100%{opacity:1;}50%{opacity:.6;}}
@keyframes barShimmer{0%{background-position:-200% 0;}100%{background-position:200% 0;}}

.kpi,.card,.tbl-row,.total-strip,.btn,.nav-item,.sub-item,.about-card,.hero,.kpi *,.tbl-head{
  transition:transform .35s cubic-bezier(.2,.9,.3,1),box-shadow .35s cubic-bezier(.2,.9,.3,1),border-color .3s ease,background .3s ease,color .25s ease,opacity .3s ease;
}

.ripple{position:absolute;border-radius:50%;pointer-events:none;background:radial-gradient(circle,rgba(255,255,255,.55) 0%,rgba(255,255,255,.15) 40%,rgba(255,255,255,0) 70%);transform:scale(0);animation:rippleGo .65s cubic-bezier(.2,.9,.3,1);z-index:100;}
.btn,.btn-refresh,.btn-create-top,.s-clear,.nav-item,.sub-item,.tbl-row.clickable{position:relative;overflow:hidden;}

#loadingbar{position:fixed;top:0;left:0;height:2px;background:linear-gradient(90deg,transparent,var(--amber) 20%,var(--gold) 50%,var(--amber) 80%,transparent);z-index:9999;border-radius:0 2px 2px 0;box-shadow:0 0 12px var(--amber),0 0 24px rgba(232,184,84,.5);animation:loadSlide 1.1s cubic-bezier(.4,0,.6,1) infinite;pointer-events:none;}

#toasts{position:fixed;bottom:48px;right:22px;z-index:9998;display:flex;flex-direction:column;gap:10px;pointer-events:none;}
.toast{min-width:280px;max-width:400px;pointer-events:auto;padding:14px 16px;border-radius:9px;background:linear-gradient(180deg,#26262f 0%,#14141a 100%);border:1px solid var(--border);box-shadow:inset 0 1px 0 rgba(255,255,255,.15),0 12px 28px rgba(0,0,0,.75);animation:toastIn .55s cubic-bezier(.2,.9,.3,1.35) both;display:flex;gap:12px;align-items:flex-start;position:relative;overflow:hidden;}
.toast.out{animation:toastOut .35s ease-in forwards;}
.toast-ico{width:34px;height:34px;border-radius:50%;flex:0 0 34px;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;animation:successPulse .55s cubic-bezier(.2,.9,.3,1.5) both;}
.toast.green .toast-ico{background:linear-gradient(180deg,#2a5539,#0e1e14);color:#b8f5ce;border:1px solid var(--green);}
.toast.red .toast-ico{background:linear-gradient(180deg,#4a1e1e,#140a0a);color:#ffb8b8;border:1px solid var(--red);}
.toast.blue .toast-ico{background:linear-gradient(180deg,#22406a,#0c182a);color:#b8dcff;border:1px solid var(--blue);}
.toast.amber .toast-ico{background:linear-gradient(180deg,#4a3c1e,#14100a);color:#f4d99b;border:1px solid var(--amber);}
.toast-body{flex:1;min-width:0;}
.toast-title{font-size:13px;font-weight:700;color:var(--text);margin-bottom:3px;}
.toast-msg{font-size:11.5px;color:var(--muted);line-height:1.5;word-wrap:break-word;}
.toast-close{background:transparent;border:none;color:var(--muted-2);font-size:14px;padding:2px 4px;cursor:pointer;line-height:1;transition:transform .25s,color .25s;}
.toast-close:hover{color:var(--text);transform:rotate(90deg) scale(1.15);}
.toast-progress{position:absolute;bottom:0;left:0;height:2px;background:linear-gradient(90deg,var(--amber),var(--gold));animation:toastProgress 3.5s linear forwards;box-shadow:0 0 8px var(--amber);}

.overlay{position:fixed;inset:0;background:rgba(2,2,5,0);backdrop-filter:blur(0);transition:background .3s ease,backdrop-filter .3s ease;display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;overflow:hidden;}
.overlay.show{background:rgba(2,2,5,.82);backdrop-filter:blur(6px);}
.modal{position:relative;background:linear-gradient(180deg,#2a2a35 0%,#1a1a22 45%,#0e0e14 100%);border:1px solid var(--border-2);border-radius:10px;box-shadow:inset 0 1px 0 rgba(255,255,255,.22),0 30px 80px rgba(0,0,0,.9);max-height:88vh;display:flex;flex-direction:column;animation:modalPop .4s cubic-bezier(.2,.9,.3,1.2) both;min-width:340px;max-width:94vw;overflow:hidden;}
.overlay.closing .modal{animation:modalOut .22s ease-in forwards;}

#splash{position:fixed;inset:0;background:var(--bg);z-index:99999;display:flex;align-items:center;justify-content:center;animation:splashFade 1.6s ease-out forwards;pointer-events:none;}
#splash .sp-logo{width:80px;height:80px;border-radius:18px;background:linear-gradient(160deg,#4a3c1e 0%,#2e2412 45%,#1a1308 100%);border:2px solid #8a6c2e;box-shadow:inset 0 2px 0 rgba(255,240,200,.55),0 0 60px rgba(232,184,84,.6),0 20px 60px rgba(0,0,0,.9);display:flex;align-items:center;justify-content:center;font-size:44px;font-weight:700;color:var(--gold);text-shadow:0 2px 4px rgba(0,0,0,.6),0 0 24px rgba(244,217,155,.8);animation:logoPop 1.5s ease-in-out infinite;}

#topbar{position:fixed;top:0;left:0;right:0;height:var(--topbar-h);background:linear-gradient(180deg,#14141b 0%,#0a0a10 60%,#07070c 100%);border-bottom:1px solid #1a1a22;box-shadow:0 3px 12px rgba(0,0,0,.6);z-index:40;}
.logo-zone{position:absolute;left:16px;top:12px;width:28px;height:28px;transition:transform .35s cubic-bezier(.2,.9,.3,1.2);}
.logo-zone:hover{transform:scale(1.08);}
.logo-glow{position:absolute;left:-10px;top:-10px;width:48px;height:48px;border-radius:50%;background:radial-gradient(circle,rgba(232,184,84,.45) 0%,rgba(232,184,84,0) 70%);pointer-events:none;animation:amberGlow 3s ease-in-out infinite;transition:opacity .35s;}
.logo-zone:hover .logo-glow{opacity:1;background:radial-gradient(circle,rgba(232,184,84,.7) 0%,rgba(232,184,84,0) 70%);}
.logo{position:absolute;inset:0;border-radius:7px;background:linear-gradient(180deg,#4a3c1e 0%,#2e2412 45%,#1a1308 100%);border:1px solid #8a6c2e;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;color:var(--gold);z-index:1;transition:transform .35s cubic-bezier(.2,.9,.3,1.5);}
.logo-zone:hover .logo{transform:rotate(-6deg) scale(1.1);}
.searchbox{position:absolute;left:50%;top:12px;transform:translateX(-50%);width:380px;height:28px;border-radius:7px;background:linear-gradient(180deg,#1a1a22 0%,#0a0a10 100%);border:1px solid var(--border);display:flex;align-items:center;cursor:pointer;padding:0 10px;gap:10px;transition:border-color .3s,box-shadow .3s,transform .3s;}
.searchbox:hover{border-color:var(--border-2);box-shadow:0 0 0 3px rgba(232,184,84,.08);transform:translateX(-50%) scale(1.01);}
.qmark{width:18px;height:18px;border-radius:50%;flex:0 0 18px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:var(--muted);background:#22222c;border:1px solid #2e2e3a;transition:transform .3s;}
.searchbox:hover .qmark{transform:scale(1.1);}
.stxt{flex:1;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.stxt.filter{color:var(--amber);font-weight:600;}
.s-clear{height:20px;padding:0 8px;border-radius:5px;font-size:10px;font-weight:700;background:#3a2e18;border:1px solid var(--amber);color:var(--amber);transition:background .25s,transform .2s;}
.s-clear:hover{background:#4a3c1e;transform:scale(1.05);}
.top-right{position:absolute;right:20px;top:12px;display:flex;gap:8px;}
.btn-refresh{width:34px;height:28px;border-radius:7px;background:linear-gradient(180deg,#22222c 0%,#131319 100%);border:1px solid var(--border);color:var(--muted);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;transition:transform .3s,color .3s,border-color .3s,box-shadow .3s;}
.btn-refresh:hover{color:var(--text);border-color:var(--border-2);transform:translateY(-1px) scale(1.05);box-shadow:0 4px 12px rgba(0,0,0,.4);}
.btn-refresh.spin{animation:spin360 .6s;}
.btn-create-top{height:28px;padding:0 16px;border-radius:7px;background:linear-gradient(180deg,#2a5539 0%,#0e1e14 100%);border:1px solid var(--green);color:#b8f5ce;font-size:12px;font-weight:700;transition:transform .3s,background .3s,box-shadow .3s;}
.btn-create-top:hover{background:#346842;transform:translateY(-1px) scale(1.02);box-shadow:0 6px 16px rgba(86,212,136,.2);}
.btn-create-top:active{transform:scale(.98);}

#sidebar{position:fixed;top:var(--topbar-h);left:0;width:var(--sidebar-w);bottom:var(--bottom-h);background:linear-gradient(180deg,#0a0a10 0%,#06060a 100%);border-right:1px solid #16161c;overflow-y:auto;overflow-x:hidden;padding-top:6px;z-index:30;}
.nav-item{position:relative;height:36px;cursor:pointer;display:flex;align-items:center;overflow:hidden;animation:navEnter .45s cubic-bezier(.2,.9,.3,1.2) both;}
.nav-item:nth-child(1){animation-delay:.02s;}
.nav-item:nth-child(2){animation-delay:.04s;}
.nav-item:nth-child(3){animation-delay:.06s;}
.nav-item:nth-child(4){animation-delay:.08s;}
.nav-item:nth-child(5){animation-delay:.1s;}
.nav-item:nth-child(6){animation-delay:.12s;}
.nav-item:nth-child(7){animation-delay:.14s;}
.nav-item:nth-child(8){animation-delay:.16s;}
.nav-item:nth-child(9){animation-delay:.18s;}
.nav-item:nth-child(10){animation-delay:.2s;}
.nav-item:nth-child(11){animation-delay:.22s;}
.nav-item:nth-child(12){animation-delay:.24s;}
.nav-item:nth-child(13){animation-delay:.26s;}
.nav-item:nth-child(14){animation-delay:.28s;}
.nav-item:nth-child(15){animation-delay:.3s;}
.nav-item:hover{background:rgba(255,255,255,.04);}
.nav-item.active{margin:0 8px;width:calc(100% - 16px);border-radius:8px;background:linear-gradient(180deg,#4a3c1e 0%,#14100a 100%);border:1px solid var(--amber);box-shadow:0 4px 14px rgba(232,184,84,.15);}
.nav-item.active::before{content:'';position:absolute;left:-9px;top:4px;bottom:4px;width:3px;background:linear-gradient(180deg,#f4d99b,#c99a3a);border-radius:0 2px 2px 0;box-shadow:0 0 12px rgba(232,184,84,.9);animation:tabSlide .5s cubic-bezier(.2,.9,.3,1.2) both;}
.nav-ico{width:22px;height:22px;border-radius:50%;flex:0 0 22px;margin-left:14px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;background:#22222c;border:1px solid #2e2e3a;color:var(--muted);}
.nav-item.active .nav-ico{background:#5a4a24;border-color:var(--amber);color:var(--gold);box-shadow:0 0 12px rgba(232,184,84,.35);}
.nav-item:hover .nav-ico{animation:iconBounce .6s cubic-bezier(.2,.9,.3,1.5);}
.nav-lbl{margin-left:10px;font-size:12.5px;color:var(--muted);white-space:nowrap;}
.nav-item.active .nav-lbl{color:var(--gold);font-weight:600;}
.nav-item:hover .nav-lbl{color:var(--text);}
.sub-item{height:24px;cursor:pointer;display:flex;align-items:center;animation:subEnter .4s cubic-bezier(.2,.9,.3,1.2) both;}
.sub-item:hover{background:rgba(255,255,255,.03);}
.sub-dot{width:4px;height:4px;border-radius:50%;background:#5e5e68;margin-left:26px;flex:0 0 4px;transition:all .3s;}
.sub-lbl{margin-left:8px;font-size:11.5px;color:var(--muted-2);white-space:nowrap;transition:color .25s,transform .25s;}
.sub-item.active .sub-dot{background:var(--amber);box-shadow:0 0 8px rgba(232,184,84,.9);}
.sub-item.active .sub-lbl{color:var(--gold);font-weight:600;}
.sub-item:hover .sub-lbl{color:#b8b8c4;transform:translateX(2px);}
.nav-badge{margin-left:auto;margin-right:12px;background:#3a2e18;border:1px solid var(--amber);color:var(--amber);font-size:9px;font-weight:700;padding:1px 6px;border-radius:20px;transition:transform .3s;}
.nav-badge.reply{margin-left:6px;margin-right:0;background:#2a5539;border-color:var(--green);color:#b8f5ce;}
.nav-item:hover .nav-badge{transform:scale(1.15);}

#content{position:fixed;top:var(--topbar-h);left:var(--sidebar-w);right:0;bottom:var(--bottom-h);overflow-y:auto;padding:26px 28px 40px;}
.page-greet{font-size:30px;font-weight:700;letter-spacing:-.6px;line-height:1.1;animation:floatUp .6s cubic-bezier(.2,.9,.3,1.1) both;}
.page-sub{font-size:13px;color:var(--muted);margin-top:4px;animation:floatUp .6s cubic-bezier(.2,.9,.3,1.1) both;animation-delay:.08s;}
.page-h1{font-size:18px;font-weight:700;letter-spacing:-.2px;animation:floatUp .5s cubic-bezier(.2,.9,.3,1.1) both;}
.page-h2{font-size:14px;font-weight:700;}

.kpi-grid{display:grid;gap:12px;margin-top:22px;}
.kpi-grid.g5{grid-template-columns:repeat(5,1fr);}
.kpi-grid.g3{grid-template-columns:repeat(3,1fr);}
.kpi{position:relative;height:88px;border-radius:8px;background:linear-gradient(180deg,#2a2a35 0%,#0e0e14 100%);border:1px solid var(--border);overflow:hidden;cursor:pointer;animation:kpiEnter .7s cubic-bezier(.2,.9,.3,1.2) both;}
.kpi:nth-child(1){animation-delay:.1s;}
.kpi:nth-child(2){animation-delay:.18s;}
.kpi:nth-child(3){animation-delay:.26s;}
.kpi:nth-child(4){animation-delay:.34s;}
.kpi:nth-child(5){animation-delay:.42s;}
.kpi:nth-child(6){animation-delay:.5s;}
.kpi:nth-child(7){animation-delay:.58s;}
.kpi:nth-child(8){animation-delay:.66s;}
.kpi:nth-child(9){animation-delay:.74s;}
.kpi:nth-child(10){animation-delay:.82s;}
.kpi:nth-child(11){animation-delay:.9s;}
.kpi:nth-child(12){animation-delay:.98s;}
.kpi:nth-child(13){animation-delay:1.06s;}
.kpi:hover{border-color:var(--border-2);transform:translateY(-5px) scale(1.02);box-shadow:0 14px 32px rgba(0,0,0,.55),0 0 0 1px rgba(232,184,84,.08);}
.kpi .bar{position:absolute;left:2px;top:11px;bottom:11px;width:3px;border-radius:2px;transition:all .35s cubic-bezier(.2,.9,.3,1.2);}
.kpi:hover .bar{top:6px;bottom:6px;box-shadow:0 0 12px currentColor;}
.kpi .t{position:absolute;left:16px;top:11px;font-size:10px;font-weight:700;letter-spacing:.9px;color:var(--muted);text-transform:uppercase;transition:color .3s;}
.kpi:hover .t{color:var(--text);}
.kpi .v{position:absolute;left:16px;top:30px;font-size:20px;font-weight:700;color:var(--text);line-height:1;}
.kpi .s{position:absolute;left:16px;top:62px;font-size:11px;color:var(--muted-2);}

.card{position:relative;border-radius:8px;background:linear-gradient(180deg,#26262f 0%,#0e0e14 100%);border:1px solid var(--border);overflow:hidden;animation:cardEnter .7s cubic-bezier(.2,.9,.3,1.1) both;animation-delay:.25s;}
.card:hover{border-color:var(--border-2);box-shadow:0 8px 24px rgba(0,0,0,.5);}
.card-hd{font-size:14px;font-weight:700;color:var(--text);}
.card-sub{font-size:11px;color:var(--muted);margin-top:3px;}
.row{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-start;}
.grow{flex:1;min-width:0;}
.mt14{margin-top:14px;} .mt18{margin-top:18px;}

.btn{height:30px;padding:0 14px;border-radius:7px;font-size:12px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--border);color:var(--muted);background:linear-gradient(180deg,#26262f 0%,#14141a 100%);white-space:nowrap;position:relative;overflow:hidden;}
.btn:hover{color:var(--text);border-color:var(--border-2);transform:translateY(-2px) scale(1.02);box-shadow:0 6px 16px rgba(0,0,0,.5);}
.btn:active{transform:translateY(0) scale(.96);}
.btn.green{background:linear-gradient(180deg,#2a5539 0%,#0e1e14 100%);border-color:var(--green);color:#b8f5ce;}
.btn.green:hover{background:linear-gradient(180deg,#346842,#0e1e14);box-shadow:0 6px 16px rgba(86,212,136,.25);}
.btn.blue{background:linear-gradient(180deg,#22406a 0%,#0c182a 100%);border-color:var(--blue);color:#b8dcff;}
.btn.blue:hover{background:linear-gradient(180deg,#2a4f7e,#0c182a);box-shadow:0 6px 16px rgba(102,176,238,.25);}
.btn.amber{background:linear-gradient(180deg,#4a3c1e 0%,#14100a 100%);border-color:var(--amber);color:#f4d99b;}
.btn.amber:hover{background:linear-gradient(180deg,#5a4a24,#14100a);box-shadow:0 6px 16px rgba(232,184,84,.25);}
.btn.red{background:linear-gradient(180deg,#4a1e1e 0%,#140a0a 100%);border-color:var(--red);color:#ffb8b8;}
.btn.red:hover{background:linear-gradient(180deg,#5a2626,#140a0a);box-shadow:0 6px 16px rgba(240,106,106,.25);}
.btn.ghost{background:linear-gradient(180deg,#22222c,#101016);}

.tbl{margin-top:4px;}
.tbl-head{display:flex;align-items:center;height:26px;padding:0 14px;background:linear-gradient(180deg,#1a1a22 0%,#0e0e14 100%);border:1px solid var(--border);border-radius:7px;font-size:10px;font-weight:700;letter-spacing:.8px;color:var(--muted);text-transform:uppercase;animation:floatUp .5s cubic-bezier(.2,.9,.3,1.1) both;animation-delay:.3s;}

<script>
"use strict";
const STORE_KEY="velora_studio_v8";
const state={page:"Dashboard",subPage:"",search:""};

/* ============================================================
   BEAUTIFUL SOUND SYSTEM
   ============================================================ */
let audioCtx = null;
let masterGain = null;
let reverbNode = null;
let convolver = null;
let soundEnabled = true;

function initAudio(){
  if(audioCtx) return;
  try {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    masterGain = audioCtx.createGain();
    masterGain.gain.value = 0.35;
    masterGain.connect(audioCtx.destination);
    reverbNode = audioCtx.createGain();
    reverbNode.gain.value = 0.12;
    const delay1 = audioCtx.createDelay();
    delay1.delayTime.value = 0.08;
    const delay2 = audioCtx.createDelay();
    delay2.delayTime.value = 0.13;
    const feedback = audioCtx.createGain();
    feedback.gain.value = 0.35;
    reverbNode.connect(delay1);
    delay1.connect(delay2);
    delay2.connect(feedback);
    feedback.connect(delay1);
    delay2.connect(masterGain);
  } catch(e){ audioCtx = null; }
}
document.addEventListener("click", function once(){ initAudio(); document.removeEventListener("click", once); }, {once:true});
document.addEventListener("keydown", function once(){ initAudio(); document.removeEventListener("keydown", once); }, {once:true});
document.addEventListener("touchstart", function once(){ initAudio(); document.removeEventListener("touchstart", once); }, {once:true});

function playNote(freq, startOffset, dur, vol, type, reverbAmount){
  if(!audioCtx) return;
  try {
    const t = audioCtx.currentTime + startOffset;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type || 'sine';
    osc.frequency.setValueAtTime(freq, t);
    gain.gain.setValueAtTime(0, t);
    gain.gain.linearRampToValueAtTime(vol, t + 0.012);
    gain.gain.exponentialRampToValueAtTime(vol * 0.6, t + 0.08);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(gain);
    gain.connect(masterGain);
    if(reverbAmount && reverbNode){
      const sendGain = audioCtx.createGain();
      sendGain.gain.value = reverbAmount;
      gain.connect(sendGain);
      sendGain.connect(reverbNode);
    }
    osc.start(t);
    osc.stop(t + dur + 0.05);
  } catch(e){}
}
function playRich(freq, startOffset, dur, vol){
  playNote(freq, startOffset, dur, vol, 'sine', 0.3);
  playNote(freq * 2, startOffset, dur * 0.7, vol * 0.25, 'sine', 0.15);
  playNote(freq * 3, startOffset, dur * 0.5, vol * 0.08, 'sine', 0.1);
}
function playClick(){ if(!audioCtx) return; playNote(1200, 0, 0.03, 0.06, 'sine', 0.2); playNote(2400, 0, 0.02, 0.03, 'sine', 0); }
function playSuccess(){ if(!audioCtx) return; playRich(523.25, 0.00, 0.55, 0.10); playRich(659.25, 0.07, 0.55, 0.10); playRich(783.99, 0.14, 0.60, 0.11); playRich(1046.5, 0.22, 0.70, 0.09); }
function playError(){ if(!audioCtx) return; playNote(392.00, 0.00, 0.25, 0.08, 'sine', 0.3); playNote(311.13, 0.12, 0.35, 0.08, 'sine', 0.3); }
function playSend(){ if(!audioCtx) return; playNote(600, 0.00, 0.10, 0.07, 'sine', 0.25); playNote(800, 0.05, 0.12, 0.08, 'sine', 0.25); playNote(1050, 0.10, 0.18, 0.09, 'sine', 0.3); playNote(1400, 0.16, 0.25, 0.07, 'sine', 0.35); }
function playNotify(){ if(!audioCtx) return; playRich(880, 0.00, 0.55, 0.09); playRich(1174.66, 0.10, 0.65, 0.08); }
function playOpen(){ if(!audioCtx) return; playNote(440, 0.00, 0.12, 0.04, 'sine', 0.3); playNote(587.33, 0.05, 0.15, 0.05, 'sine', 0.3); }
function playDelete(){ if(!audioCtx) return; playNote(440, 0.00, 0.15, 0.07, 'sine', 0.3); playNote(329.63, 0.08, 0.22, 0.07, 'sine', 0.3); }
function playNav(){ if(!audioCtx) return; playNote(660, 0.00, 0.08, 0.03, 'sine', 0.2); }

/* ==================== EMAIL BACKEND (CLOUDFLARE WORKER) ==================== */
const BACKEND_URL = "https://velora-email-server.mflow-velora-2026.workers.dev";

function getGmailTokens(){
  try{ return JSON.parse(localStorage.getItem("velora_gmail_tokens")||"null"); }catch(e){ return null; }
}
function setGmailTokens(t){
  try{ localStorage.setItem("velora_gmail_tokens", JSON.stringify(t)); }catch(e){}
}
function clearGmailTokens(){
  try{ localStorage.removeItem("velora_gmail_tokens"); }catch(e){}
}
function isGmailConnected(){
  const t = getGmailTokens();
  return !!(t && t.tokens && (t.tokens.access_token || t.tokens.refresh_token));
}
function getConnectedEmail(){
  const t = getGmailTokens();
  if(!t) return null;
  return t.email || null;
}
function getConnectedDisplay(){
  return getConnectedEmail() || "your Gmail account";
}
async function connectGmail(){
  try{
    const res = await fetch(BACKEND_URL + "/api/auth/google");
    const j = await res.json();
    if(j.url){
      toast("Opening Google...","Please allow access","blue");
      setTimeout(()=>{ window.location.href = j.url; }, 400);
    } else {
      toast("Connect failed", j.error||"Try again", "red");
    }
  }catch(e){
    toast("Connect failed", String(e.message||e), "red");
  }
}
function disconnectGmail(){
  clearGmailTokens();
  render();
  toast("Gmail disconnected","You can reconnect anytime","blue");
}

/* ==================== ONBOARDING ==================== */
const ONBOARD_KEY = "velora_onboarded_v1";
function isOnboarded(){ try{ return localStorage.getItem(ONBOARD_KEY) === "yes"; }catch(e){ return false; } }
function markOnboarded(){ try{ localStorage.setItem(ONBOARD_KEY, "yes"); }catch(e){} }
function showOnboardingStep(n){
  const ov = document.getElementById("onboarding"); if(!ov) return;
  ov.querySelectorAll(".ob-step").forEach(s=>{
    s.classList.remove("active");
    if(String(s.dataset.step) === String(n)) s.classList.add("active");
  });

function ripple(e){
  const el=e.currentTarget; if(!el || el.dataset.noRipple==="1") return;
  const rect=el.getBoundingClientRect(); const size=Math.max(rect.width,rect.height)*1.6;
  const x=(e.clientX||rect.left+rect.width/2)-rect.left-size/2;
  const y=(e.clientY||rect.top+rect.height/2)-rect.top-size/2;
  const rip=document.createElement("span"); rip.className="ripple";
  rip.style.width=rip.style.height=size+"px"; rip.style.left=x+"px"; rip.style.top=y+"px";
  el.appendChild(rip); setTimeout(()=>rip.remove(),700);
}
function toast(title,msg,type){

function countUpValue(el,target,prefix){
  if(!el) return; prefix=prefix||"";
  const start=performance.now(); const dur=1100; const targetNum=+target||0;
  function step(now){
    const t=Math.min(1,(now-start)/dur); const eased=1-Math.pow(1-t,3);
    el.textContent=prefix+(targetNum*eased).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
    if(t<1) requestAnimationFrame(step);
    else el.textContent=prefix+targetNum.toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
  }
  requestAnimationFrame(step);
}

async function sendEmailViaBackend(data){
  const t = getGmailTokens();
  if(!t || !t.tokens){
    return { success:false, error:"Gmail not connected. Go to Settings → Connect Gmail." };
  }
  try{
    const res = await fetch(BACKEND_URL + "/api/send", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        tokens: t.tokens,
        to: data.to,
        cc: data.cc||"",
        bcc: data.bcc||"",
        subject: data.subject,
        body: data.body
      })
    });
    const j = await res.json();
    if(j.ok) return { success: true };
    return { success:false, error: j.error || "Send failed" };
  }catch(err){
    return { success:false, error: String(err && err.message || err) };
  }
}

async function fetchReplies(){
  const t = getGmailTokens();
  if(!t || !t.tokens){ toast("Connect Gmail first","Go to Settings","red"); return; }
  toast("Checking for replies...","Please wait","blue");
  try{
    const res = await fetch(BACKEND_URL + "/api/replies", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ tokens: t.tokens, subject: "Invoice" })
    });
    const data = await res.json();
    if(data && Array.isArray(data.replies)){
      const existing = (DB.replies || []).map(r=>r.date + "|" + r.from);
      let newCount = 0;
      data.replies.forEach(r=>{
        const key = r.date + "|" + r.from;
        if(existing.indexOf(key) === -1){
          DB.replies.unshift(r);
          newCount++;
        }
      });
      DB.replies.sort((a,b)=> new Date(b.date) - new Date(a.date));
      if(DB.replies.length > 200) DB.replies.length = 200;
      saveDB();
      render();
      if(newCount > 0){
        toast(`${newCount} new reply received!`, "Check Replies page", "green");
        playNotify();
      } else {
        toast("No new replies", "All caught up", "blue");
      }
    } else {
      toast("No replies found", "Try again later", "amber");
    }
  }catch(err){
    toast("Fetch failed", "Check your connection", "red");
  }
}

function renderSidebar(){
  let h="";
  NAV.forEach(item=>{
    const active=state.page===item.page;
    let badge = "";
    if(item.page==="EmailLog" && DB.emailLog.length) badge = `<span class="nav-badge">${DB.emailLog.length}</span>`;
    if(item.page==="Replies" && DB.replies && DB.replies.length) badge = `<span class="nav-badge reply">${DB.replies.length}</span>`;
    h+=`<div class="nav-item ${active?"active":""}" data-action="nav" data-page="${esc(item.page)}" data-sub="${esc(item.sub||"")}">
      <div class="nav-ico">${esc(item.icon)}</div><div class="nav-lbl">${esc(item.label)}</div>${badge}
    </div>`;
    if(active&&item.children){
      item.children.forEach(ch=>{
        const sa=state.subPage===ch.sub||(state.subPage===""&&ch.sub===item.sub);
        h+=`<div class="sub-item ${sa?"active":""}" data-action="nav" data-page="${esc(ch.page)}" data-sub="${esc(ch.sub)}"><div class="sub-dot"></div><div class="sub-lbl">${esc(ch.label)}</div></div>`;
      });
    }
  });
  $("#sidebar").innerHTML=h;
}

function tblHead(cols){return `<div class="tbl-head">${cols.map(c=>{const st=(c.w?`width:${c.w}px;`:"")+(c.flex?"flex:1;min-width:0;":"")+(c.align?`text-align:${c.align};`:"");return `<div class="th ${c.flex?"flex":""} ${c.align==="right"?"right":""}" style="${st}">${esc(c.label)}</div>`;}).join("")}</div>`;}
function tblRow(cols,cells,attrs){attrs=attrs||{};const clickable=!!attrs.action;return `<div class="tbl-row ${clickable?"clickable":""}" ${attrs.action?`data-action="${esc(attrs.action)}"`:""} ${attrs.id?`data-id="${esc(attrs.id)}"`:""}>${cols.map((c,i)=>{const v=cells[i];const st=(c.w?`width:${c.w}px;`:"")+(c.flex?"flex:1;min-width:0;":"")+(c.align?`text-align:${c.align};`:"");const cls=`td ${c.flex?"flex":""} ${c.align==="right"?"right":""}`;const col=(v&&v.color)?v.color:(c.color||"");const txt=(v&&typeof v==="object")?v.text:v;const bold=(v&&v.bold)?"font-weight:700;":"";return `<div class="${cls}" style="${st}${col?`color:${col};`:""}${bold}">${txt===undefined?"":txt}</div>`;}).join("")}</div>`;}
function emptyState(title,subtitle,btnLabel,btnAction){return `<div class="empty"><h3>${esc(title)}</h3><p>${esc(subtitle)}</p>${btnLabel?`<button class="btn green" data-action="${esc(btnAction)}">${esc(btnLabel)}</button>`:""}</div>`;}
function totalStrip(color,label,value){return `<div class="total-strip ${color} mt14"><div style="flex:1;">${esc(label)}</div><div>${esc(value)}</div></div>`;}

function pageDashboard(){
  const rev=sumAll(),exp=sumExpenses(),prof=rev-exp;
  const recv=sumByStatus("Pending")+sumByStatus("Overdue")+sumByStatus("Partial");
  const pay=sumVendorBalance();
  const cards=[
    {t:"REVENUE",v:money(rev),raw:rev,s:"Total income",c:"var(--green)"},
    {t:"EXPENSES",v:money(exp),raw:exp,s:"Total spent",c:"var(--red)"},
    {t:"PROFIT",v:money(prof),raw:prof,s:"Net profit",c:"var(--blue)"},
    {t:"RECEIVABLE",v:money(recv),raw:recv,s:"Unpaid invoices",c:"var(--amber)"},
    {t:"PAYABLE",v:money(pay),raw:pay,s:"Vendor dues",c:"var(--purple)"}
  ];
  return `<div class="page-greet">${esc(greeting())}</div>
    <div class="page-sub">Business overview &nbsp;-&nbsp; ${esc(new Date().toLocaleDateString("en-GB",{weekday:"long",day:"2-digit",month:"long",year:"numeric"}))}</div>
    <div class="kpi-grid g5">${cards.map(c=>`<div class="kpi"><div class="bar" style="background:${c.c};"></div><div class="t">${c.t}</div><div class="v" data-count="${c.raw}" data-prefix="${esc(currency())} ">${esc(c.v)}</div><div class="s">${c.s}</div></div>`).join("")}</div>
    <div class="row mt18" style="align-items:stretch;">${revenueChart()}${cashPosition(rev,exp,prof)}</div>
    <div class="mt18">${DB.invoices.length ? invoiceTable(5,"Recent Invoices",true) : emptyState("No invoices yet","Start by creating your first invoice","+ Create Invoice","new-invoice")}</div>`;
}
function revenueChart(){
  const labels=[],vals=[];const now=new Date();
  for(let i=5;i>=0;i--){const d=new Date(now.getFullYear(),now.getMonth()-i,1);labels.push(d.toLocaleString("en-US",{month:"short"}));let t=0;DB.invoices.forEach(inv=>{const dt=new Date(inv.date);if(!isNaN(dt)&&dt.getMonth()===d.getMonth()&&dt.getFullYear()===d.getFullYear())t+=safeNum(inv.total);});vals.push(t);}
  const has=vals.some(v=>v>0);
  const disp=has?vals:[0.35,0.55,0.42,0.72,0.60,0.88].map(v=>v*10000);
  const max=Math.max.apply(null,disp.concat([1]));
  return `<div class="card grow" style="flex:0 0 62%;min-height:230px;padding:14px 0 0;"><div style="padding:0 18px;"><div class="card-hd">Revenue Overview</div><div class="card-sub">Last 6 months</div></div><div class="bars" style="margin-top:14px;">${disp.map((v,i)=>`<div class="bar-col"><div class="bar-fill" style="height:${Math.max(4,(v/max)*100)}%;"></div><div class="bar-lbl">${labels[i]}</div></div>`).join("")}</div></div>`;
}

  return `<div class="card grow" style="min-height:230px;padding:16px 18px;"><div class="card-hd">Cash Position</div><div class="card-sub">Current balances</div>
    <div style="margin-top:20px;"><div style="font-size:10px;font-weight:700;color:var(--muted);">INCOME</div><div style="font-size:19px;font-weight:700;color:var(--green);margin-top:3px;">${money(rev)}</div></div>
    <div style="margin-top:16px;"><div style="font-size:10px;font-weight:700;color:var(--muted);">EXPENSES</div><div style="font-size:19px;font-weight:700;color:var(--red);margin-top:3px;">${money(exp)}</div></div>
    <div style="margin-top:16px;"><div style="font-size:10px;font-weight:700;color:var(--muted);">NET</div><div style="font-size:19px;font-weight:700;color:var(--blue);margin-top:3px;">${money(prof)}</div></div>
  </div>`;
}
function pageSales(){

  if(state.subPage==="Invoices")h+=invoiceTable(999,"",true);
  else if(state.subPage==="Estimates")h+=estimatesTable();

function invoiceTable(maxRows,title,clickable){
  const cols=[{label:"INVOICE",w:120},{label:"CLIENT",flex:true},{label:"DATE",w:110},{label:"STATUS",w:100},{label:"TOTAL",w:140,align:"right"}];
  let h="";if(title)h+=`<div class="page-h2" style="margin-bottom:10px;">${esc(title)}</div>`;
  if(!DB.invoices.length&&!state.search)return h+emptyState("No invoices yet","Click below to create your first invoice","+ Create First Invoice","new-invoice");
  h+=tblHead(cols);
  const rows=DB.invoices.filter(i=>matchSearch(i.id,i.client,i.status)).slice(0,maxRows);
  rows.forEach(inv=>{h+=tblRow(cols,[{text:esc(inv.id),bold:true},{text:esc(inv.client)},{text:esc(inv.date),color:"var(--muted)"},{text:esc(inv.status),color:statusColor(inv.status),bold:true},{text:esc(money(inv.total)),bold:true}],clickable?{action:"invoice-click",id:inv.id}:{});});
  return h;
}

function pageInventory(){
  let h=`<div class="page-h1">Inventory</div>`;
  if(!DB.products.length)return h+emptyState("No products in inventory","Add products with stock","+ Add Product","new-product");
  let totalValue=0,lowStock=0;
  DB.products.forEach(p=>{totalValue+=safeNum(p.stock)*safeNum(p.cost);if(safeNum(p.stock)<5)lowStock++;});
  h+=`<div class="kpi-grid g3 mt18">
    <div class="kpi"><div class="bar" style="background:var(--green);"></div><div class="t">STOCK VALUE</div><div class="v">${esc(money(totalValue))}</div></div>
    <div class="kpi"><div class="bar" style="background:var(--blue);"></div><div class="t">PRODUCT COUNT</div><div class="v">${DB.products.length}</div></div>
    <div class="kpi"><div class="bar" style="background:var(--red);"></div><div class="t">LOW STOCK</div><div class="v" style="color:var(--red);">${lowStock}</div></div>
  </div>`;
  const cols=[{label:"ID",w:100},{label:"PRODUCT",flex:true},{label:"STOCK",w:140,align:"right"},{label:"COST",w:140,align:"right"},{label:"VALUE",w:150,align:"right"}];
  h+=`<div class="mt18">`+tblHead(cols);
  DB.products.filter(p=>matchSearch(p.id,p.name)).forEach(p=>{
    const st=safeNum(p.stock),cst=safeNum(p.cost);
    const col=st<5?"var(--red)":(st<20?"var(--amber)":"var(--green)");
    h+=tblRow(cols,[{text:esc(p.id),bold:true},{text:esc(p.name),bold:true},{text:esc(num2(st)),color:col,bold:true},{text:esc(money(cst)),color:"var(--amber)"},{text:esc(money(st*cst)),bold:true}],{action:"product-click",id:p.id});
  });
  return h+"</div>";
}

function pageTrialBalance(){
  const cols=[{label:"CODE",w:110},{label:"ACCOUNT",flex:true},{label:"DEBIT",w:200,align:"right"},{label:"CREDIT",w:200,align:"right"}];
  let h=`<div class="page-h1">Trial Balance</div><div class="page-sub">As of ${esc(new Date().toLocaleDateString("en-GB",{day:"2-digit",month:"short",year:"numeric"}))}</div><div class="mt18">`+tblHead(cols);
  let totDr=0,totCr=0;
  DB.accounts.forEach(a=>{const bal=safeNum(a.balance);let dr=0,cr=0;if(a.type==="Asset"||a.type==="Expense"){if(bal>=0)dr=bal;else cr=-bal;}else{if(bal>=0)cr=bal;else dr=-bal;}totDr+=dr;totCr+=cr;h+=tblRow(cols,[{text:esc(a.code),bold:true},{text:esc(a.name),bold:true},{text:dr?esc(money(dr)):"-",color:"var(--green)"},{text:cr?esc(money(cr)):"-",color:"var(--red)"}]);});
  h+=`</div><div class="total-strip amber mt14"><div style="width:200px;">TOTALS</div><div style="width:200px;text-align:right;color:var(--green);">${esc(money(totDr))}</div><div style="width:200px;text-align:right;color:var(--red);">${esc(money(totCr))}</div></div>`;
  return h;
}
function pagePL(){
  const revs=DB.accounts.filter(a=>a.type==="Revenue");const exps=DB.accounts.filter(a=>a.type==="Expense");
  const tr=revs.reduce((t,a)=>t+safeNum(a.balance),0);const te=exps.reduce((t,a)=>t+safeNum(a.balance),0);const net=tr-te;
  const nc=net>=0?"var(--green)":"var(--red)";
  const line=(a,c)=>`<div style="display:flex;align-items:center;height:24px;padding:0 28px;"><div style="flex:1;font-size:12px;">${esc(a.code)} &nbsp; ${esc(a.name)}</div><div style="width:180px;text-align:right;font-size:12px;font-weight:700;color:${c};">${esc(money(a.balance))}</div></div>`;
  return `<div class="page-h1">Profit &amp; Loss Statement</div><div class="page-sub">For the current period</div><div class="mt18">
    <div class="total-strip green" style="height:34px;"><div style="font-size:12px;font-weight:700;">REVENUE</div></div>
    ${revs.map(a=>line(a,"var(--green)")).join("")}
    <div style="display:flex;height:26px;align-items:center;padding:0 28px;"><div style="flex:1;font-size:13px;font-weight:700;">Total Revenue</div><div style="width:180px;text-align:right;font-size:13px;font-weight:700;color:var(--green);">${esc(money(tr))}</div></div>

    ${exps.map(a=>line(a,"var(--red)")).join("")}

async function invoiceActions(invId){
  const inv=DB.invoices.find(i=>i.id===invId); if(!inv)return;
  const paid=getInvoicePaid(invId); const bal=safeNum(inv.total)-paid;
  const client = DB.clients.find(c=>c.name.toLowerCase()===String(inv.client).toLowerCase()) || {};
  const choice=await actionSheet(`Invoice ${invId}  •  ${inv.client}  •  ${money(inv.total)}`+"\nEmail: "+(client.email||"(not set)"),[
    {label:"Mark as Paid",value:"P",cls:"green"},{label:"Mark as Pending",value:"N",cls:"blue"},{label:"Mark as Overdue",value:"O",cls:"red"},
    {label:"Modify / Edit",value:"M",cls:"amber"},{label:"Record Payment",value:"Y",cls:"green"},
    {label:"📧 Email Invoice",value:"E",cls:"green"},
    {label:"Export PDF",value:"X",cls:"ghost"},{label:"Delete",value:"D",cls:"red"}]);
  if(!choice)return;
  if(["P","N","O"].includes(choice)){const map={P:"Paid",N:"Pending",O:"Overdue"};inv.status=map[choice];saveDB();render();toast("Status updated",invId,"green");}
  else if(choice==="M") await editInvoice(invId);
  else if(choice==="Y") await quickRecordPayment(invId);
  else if(choice==="E") emailComposer(invId);
  else if(choice==="X") exportInvoicePDF(invId);
  else if(choice==="D"){ if(await confirmBox(`Delete invoice ${invId}?`,"Delete")){DB.invoices=DB.invoices.filter(i=>i.id!==invId);saveDB();render();toast("Deleted",invId,"red");} }
}
async function editInvoice(invId){
  const inv=DB.invoices.find(i=>i.id===invId);if(!inv)return;

function download(filename,content,mime){const blob=new Blob([content],{type:(mime||"text/csv")+";charset=utf-8"});const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download=filename;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(url);a.remove();},400);}
function csvEsc(s){s=String(s??"");if(s.indexOf(",")!==-1||s.indexOf('"')!==-1||s.indexOf("\n")!==-1)return '"'+s.replace(/"/g,'""')+'"';return s;}
function toCSV(rows){return rows.map(r=>r.map(csvEsc).join(",")).join("\r\n");}
function exportSheetCSV(which){
  const maps={
    invoices:{file:"Velora_Invoices",rows:DB.invoices,cols:["ID","Client","Date","DueDate","Status","Subtotal","Tax","Total","Notes"],row:i=>[i.id,i.client,i.date,i.dueDate,i.status,i.subtotal,i.tax,i.total,i.notes]},
    clients:{file:"Velora_Clients",rows:DB.clients,cols:["ID","Name","City","Email","Phone","NTN"],row:c=>[c.id,c.name,c.city,c.email,c.phone,c.ntn]},
    vendors:{file:"Velora_Vendors",rows:DB.vendors,cols:["ID","Name","City","Email","Phone","NTN","Balance"],row:v=>[v.id,v.name,v.city,v.email,v.phone,v.ntn,v.balance]},
    products:{file:"Velora_Products",rows:DB.products,cols:["ID","Name","Rate","Cost","Stock","Category"],row:p=>[p.id,p.name,p.rate,p.cost,p.stock,p.category]},
    expenses:{file:"Velora_Expenses",rows:DB.expenses,cols:["ID","Date","Category","Vendor","Amount","Tax","Total"],row:e=>[e.id,e.date,e.category,e.vendor,e.amount,e.tax,e.total]},
    emailLog:{file:"Velora_EmailLog",rows:DB.emailLog,cols:["ID","Timestamp","To","Subject","Status"],row:e=>[e.id,e.ts,e.to,e.subject,e.status]},
    replies:{file:"Velora_Replies",rows:DB.replies||[],cols:["From","Subject","Date","Snippet"],row:r=>[r.from,r.subject,r.date,r.snippet]}
  };
  const m=maps[which]; if(!m)return;
  if(!m.rows.length){alertBox("No data to export.","Export");return;}
  const csv=[m.cols].concat(m.rows.map(m.row));

function restoreFile(){
  const input=document.createElement("input");input.type="file";input.accept=".json,application/json";
  input.onchange=()=>{const file=input.files&&input.files[0];if(!file)return;const reader=new FileReader();reader.onload=async ev=>{try{const parsed=JSON.parse(ev.target.result);if(!parsed||typeof parsed!=="object")throw new Error("Invalid file.");if(!(await confirmBox("Replace current data?","Restore")))return;const base=defaultDB();DB=Object.assign(base,parsed);DB.config=Object.assign(base.config,parsed.config||{});if(!Array.isArray(DB.accounts)||!DB.accounts.length)DB.accounts=defaultAccounts();if(!Array.isArray(DB.emailLog))DB.emailLog=[];if(!Array.isArray(DB.replies))DB.replies=[];saveDB();render();toast("Backup restored","","green");}catch(err){toast("Restore failed",err.message,"red");}};reader.readAsText(file);};input.click();
}
async function editCompany(){
  const r=await formModal("Company Info",[{key:"name",label:"Company Name",value:DB.config.companyName,required:true},{key:"email",label:"Company Email",value:DB.config.companyEmail},{key:"senderName",label:"Sender Name",value:DB.config.senderName||""},{key:"senderEmail",label:"Reply-To Email",value:DB.config.senderEmail||""}],"Save");
  if(!r)return; DB.config.companyName=r.name.trim(); DB.config.companyEmail=r.email.trim(); DB.config.senderName=r.senderName.trim(); DB.config.senderEmail=r.senderEmail.trim();
  saveDB();render(); toast("Company info saved",DB.config.companyName,"green");
}
async function editTax(){
  const r=await formModal("Tax Rate",[{key:"rate",label:"Tax Rate (%)",value:DB.config.taxRatePct}],"Save");
  if(!r)return; let v=safeNum(r.rate); if(v<0)v=0; if(v>100)v=100; DB.config.taxRatePct=v; saveDB();render(); toast("Updated",`${num2(v)}%`,"green");
}
async function editCurrency(){
  const r=await formModal("Currency",[{key:"currency",label:"Currency",type:"select",value:DB.config.currency,options:["PKR","INR","USD","AED","SAR","GBP","EUR"]}],"Save");
  if(!r)return; DB.config.currency=(r.currency||"PKR").toUpperCase(); saveDB();render(); toast("Updated",DB.config.currency,"green");
}
function viewRawData(){
  const json=JSON.stringify(DB,null,2);
  const ov=openModal(`<div class="modal-title">Raw Data</div><div class="modal-body"><textarea class="mono" readonly>${esc(json)}</textarea></div><div class="modal-actions"><button class="btn ghost" data-close>Close</button><button class="btn green" data-copy>Copy</button></div>`,{width:Math.min(720,window.innerWidth-40)});
  ov.querySelector("[data-close]").onclick=()=>closeModal(ov);
  ov.querySelector("[data-copy]").onclick=()=>{const ta=ov.querySelector("textarea");ta.select();try{document.execCommand("copy");}catch(e){}toast("Copied","","green");};
}
async function resetAll(){
  if(!(await confirmBox("DELETE ALL DATA?","Reset All Data")))return;
  if(!(await confirmBox("Final confirmation?","Reset")))return;
  const keep=Object.assign({},DB.config);DB=defaultDB();DB.config=keep;
  state.search="";state.page="Dashboard";state.subPage="";saveDB();render();toast("All data reset","","red");
}
async function loadSample(){
  if(!(await confirmBox("Load sample data?\n\nExisting data NOT deleted.","Load Sample")))return;
  const products=[["PR-001","Website Design",1500,800,10,"Services"],["PR-002","UI/UX Design",600,300,15,"Services"],["PR-003","Brand Strategy",400,200,20,"Services"],["PR-004","Monthly Maintenance",300,100,50,"Services"]];
  products.forEach(p=>{if(!DB.products.some(x=>x.id===p[0]))DB.products.push({id:p[0],name:p[1],rate:p[2],cost:p[3],stock:p[4],category:p[5]});});
  const clients=[["CL-001","Ali Khan","Karachi","ali@example.com","0300-1234567","1234567-8"],["CL-002","Sara Ahmed","Lahore","sara@example.com","0300-2345678",""],["CL-003","Bilal Hussain","Islamabad","bilal@example.com","",""]];
  clients.forEach(c=>{if(!DB.clients.some(x=>x.id===c[0]))DB.clients.push({id:c[0],name:c[1],city:c[2],email:c[3],phone:c[4],ntn:c[5]});});
  const inv=[["INV-001","Ali Khan",-10,20,"Paid",2100,210,2310,"Website"],["INV-002","Sara Ahmed",-8,22,"Paid",900,90,990,"Branding"],["INV-003","Bilal Hussain",-30,-5,"Overdue",500,50,550,"SEO"]];
  inv.forEach(i=>{if(!DB.invoices.some(x=>x.id===i[0]))DB.invoices.push({id:i[0],client:i[1],date:addDaysISO(i[2]),dueDate:addDaysISO(i[3]),status:i[4],subtotal:i[5],tax:i[6],total:i[7],notes:i[8]});});
  const exp=[["EXP-001",-5,"Rent","Landlord",50000,0,50000,"6100"],["EXP-002",-3,"Utilities","K-Electric",8000,0,8000,"6200"]];
  exp.forEach(e=>{if(!DB.expenses.some(x=>x.id===e[0]))DB.expenses.push({id:e[0],date:addDaysISO(e[1]),category:e[2],vendor:e[3],amount:e[4],tax:e[5],total:e[6],account:e[7]});});
  updateAccountBalance("4000",2310+990+550);updateAccountBalance("6100",50000);updateAccountBalance("6200",8000);
  saveDB();state.page="Dashboard";state.subPage="";render();
  toast("Sample data loaded","4 Products · 3 Clients · 3 Invoices","green");
}

/* ==================== OAUTH CALLBACK HANDLER ==================== */
(function handleOAuthReturn(){
  if(window.location.hash && window.location.hash.indexOf("#connected=") === 0){
    try{
      const data = JSON.parse(decodeURIComponent(window.location.hash.slice(11)));
      setGmailTokens(data);
      history.replaceState(null, "", window.location.pathname);
      setTimeout(()=>{
        toast("Gmail connected! 🎉", data.email || "You can now send emails from your Gmail", "green");
        render();
      }, 600);
    }catch(e){
      console.error("OAuth parse error:", e);
    }
  }
})();

(function init(){
  if(!DB.accounts||!DB.accounts.length)DB.accounts=defaultAccounts();
  if(!Array.isArray(DB.emailLog))DB.emailLog=[];
  if(!Array.isArray(DB.replies))DB.replies=[];
  saveDB();
  initOnboarding();
  render();
  setInterval(()=>{
    const ov = document.getElementById("onboarding");
    if(isGmailConnected() && ov && ov.style.display === "none"){
      fetchReplies().catch(()=>{});
    }
  }, 120000);
})();
