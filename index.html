<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Velora Studio</title>
<style>
:root{--bg:#06060a;--panel:#0a0a10;--border:#2e2e3a;--border-2:#444452;--text:#eef0f4;--muted:#8e8e9a;--muted-2:#5e5e68;--green:#56d488;--blue:#66b0ee;--red:#f06a6a;--amber:#e8b854;--gold:#f4d99b;--purple:#a889e8;--topbar-h:52px;--sidebar-w:196px;}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{background:var(--bg);color:var(--text);font-family:"Inter","SF Pro Display","Segoe UI",system-ui,-apple-system,Arial,sans-serif;font-size:13.5px;overflow:hidden;-webkit-font-smoothing:antialiased;letter-spacing:-0.01em;transition:background .35s,color .35s;}
::-webkit-scrollbar{width:9px;height:9px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:linear-gradient(180deg,#3a3a48,#1e1e28);border-radius:5px;border:1px solid #2a2a34;}
::-webkit-scrollbar-thumb:hover{background:linear-gradient(180deg,#4a4a5a,#2a2a34);}
button{font-family:inherit;cursor:pointer;}
body.light-mode{--bg:#f5f6f8;--panel:#ffffff;--text:#181820;--muted:#5e5e6a;--muted-2:#9a9aa4;--border:#e2e4ea;--border-2:#c4c8d0;background:#f5f6f8;color:#181820;}
body.light-mode ::-webkit-scrollbar-thumb{background:linear-gradient(180deg,#c8c8d0,#a8a8b0);border-color:#b8b8c0;}
body.light-mode #topbar{background:linear-gradient(180deg,#ffffff 0%,#f5f6f8 100%);border-bottom-color:#e2e4ea;box-shadow:0 3px 12px rgba(0,0,0,.06);}
body.light-mode #sidebar{background:linear-gradient(180deg,#ffffff 0%,#f8f9fb 100%);border-right-color:#e2e4ea;}
body.light-mode #content{background:radial-gradient(ellipse 900px 500px at 15% 0%,rgba(232,184,84,.08),transparent 60%),#f5f6f8;}
body.light-mode #content::before{opacity:.5;}
body.light-mode #content::after{opacity:.4;}
body.light-mode .kpi,body.light-mode .card,body.light-mode .about-card,body.light-mode .tbl-head,body.light-mode .tbl-row,body.light-mode .empty{background:linear-gradient(160deg,#ffffff 0%,#f8f9fb 100%);border-color:#e2e4ea;box-shadow:inset 0 1px 0 #fff,0 1px 3px rgba(0,0,0,.05);}
body.light-mode .kpi:hover,body.light-mode .card:hover{border-color:#d0d4dc;box-shadow:inset 0 1px 0 #fff,0 12px 28px rgba(0,0,0,.1);}
body.light-mode .kpi-value{color:#181820;text-shadow:none;}
body.light-mode .kpi-label{color:#5e5e6a;}
body.light-mode .kpi:hover .kpi-label{color:#181820;}
body.light-mode .kpi-note{color:#8a8a94;}
body.light-mode .kpi::after{background:linear-gradient(180deg,rgba(0,0,0,.015) 0%,transparent 45%);}
body.light-mode .card::after{background:linear-gradient(180deg,rgba(0,0,0,.01) 0%,transparent 35%);}
body.light-mode .tbl-row.clickable:hover{background:linear-gradient(90deg,rgba(232,184,84,.1) 0%,#f8f9fb 40%);}
body.light-mode .tbl-row:hover .td{color:#181820;}
body.light-mode .modal{background:linear-gradient(180deg,#ffffff 0%,#f5f6f8 100%);border-color:#d0d4dc;box-shadow:0 30px 80px rgba(0,0,0,.25);}
body.light-mode .modal-title,body.light-mode .modal-actions{border-color:rgba(0,0,0,.06);}
body.light-mode .field input,body.light-mode .field select,body.light-mode .field textarea{background:#ffffff;border-color:#d0d4dc;color:#181820;}
body.light-mode .field span{color:#5e5e6a;}
body.light-mode .overlay.show{background:rgba(240,240,245,.75);}
body.light-mode .nav-item:hover{background:rgba(0,0,0,.03);}
body.light-mode .sub-item:hover{background:rgba(0,0,0,.02);}
body.light-mode .nav-ico{background:#f0f1f5;border-color:#d0d4dc;}
body.light-mode .nav-lbl{color:#5e5e6a;}
body.light-mode .nav-item:hover .nav-lbl{color:#181820;}
body.light-mode .sub-lbl{color:#9a9aa4;}
body.light-mode .searchbox{background:linear-gradient(180deg,#ffffff 0%,#f5f6f8 100%);border-color:#e2e4ea;}
body.light-mode .qmark{background:#eef0f4;border-color:#d0d4dc;color:#5e5e6a;}
body.light-mode .stxt{color:#5e5e6a;}
body.light-mode .btn-refresh{background:linear-gradient(180deg,#ffffff 0%,#f0f1f5 100%);border-color:#d0d4dc;color:#5e5e6a;}
body.light-mode .btn{background:linear-gradient(180deg,#ffffff 0%,#f0f1f5 100%);border-color:#d0d4dc;color:#5e5e6a;}
body.light-mode .btn.ghost{background:linear-gradient(180deg,#f8f9fb,#eef0f4);}
body.light-mode .toast{background:linear-gradient(180deg,#ffffff 0%,#f5f6f8 100%);box-shadow:0 12px 28px rgba(0,0,0,.15);}
body.light-mode .toast-title{color:#181820;}
body.light-mode .toast-msg{color:#5e5e6a;}
body.light-mode .chart-tooltip{background:linear-gradient(180deg,#ffffff,#f5f6f8);box-shadow:0 12px 32px rgba(0,0,0,.2);color:#181820;}
body.light-mode .chart-x-labels span{color:#5e5e6a;}
body.light-mode .chart-grid line{stroke:rgba(0,0,0,.06);}
body.light-mode .chart-dot{fill:#ffffff;}
body.light-mode .total-strip.green{background:linear-gradient(180deg,rgba(86,212,136,.15),rgba(86,212,136,.05));color:#2a8a55;}
body.light-mode .total-strip.red{background:linear-gradient(180deg,rgba(240,106,106,.15),rgba(240,106,106,.05));color:#a83a3a;}
body.light-mode .total-strip.blue{background:linear-gradient(180deg,rgba(102,176,238,.15),rgba(102,176,238,.05));color:#3a7ab8;}
body.light-mode .total-strip.amber{background:linear-gradient(180deg,rgba(232,184,84,.15),rgba(232,184,84,.05));color:#a8781a;}
body.light-mode .btn.green{background:linear-gradient(180deg,#e8f5ed,#d0ebda);border-color:#56d488;color:#1a6a35;}
body.light-mode .btn.blue{background:linear-gradient(180deg,#e0eefa,#c8e0f4);border-color:#66b0ee;color:#1a5588;}
body.light-mode .btn.amber{background:linear-gradient(180deg,#faf0d8,#f0e0b8);border-color:#e8b854;color:#8a6218;}
body.light-mode .btn.red{background:linear-gradient(180deg,#fae0e0,#f4c8c8);border-color:#f06a6a;color:#8a2a2a;}
body.light-mode .btn-create-top{background:linear-gradient(180deg,#e8f5ed,#d0ebda);color:#1a6a35;}
body.light-mode .about-card pre{color:#4a4a5a;}
body.light-mode .hero{background:linear-gradient(160deg,#faf0d8 0%,#f0e0b8 40%,#e8d8a8 100%);color:#4a3a1a;}
body.light-mode .logo{background:linear-gradient(180deg,#faf0d8 0%,#e8d8a8 100%);color:#8a6218;}
body.light-mode .ob-card{background:linear-gradient(180deg,#ffffff,#f5f6f8);}
body.light-mode .ob-h1{color:#181820;}
body.light-mode .ob-sub{color:#5e5e6a;}
body.light-mode .ob-field span{color:#5e5e6a;}
body.light-mode .ob-field input{background:#ffffff;border-color:#d0d4dc;color:#181820;}
body.light-mode .theme-btn{background:linear-gradient(160deg,#ffffff,#f5f6f8);border-color:#e2e4ea;}
body.light-mode .gcal-weekday{background:#f8f9fb;}
body.light-mode .gcal-day{background:#ffffff;}
body.light-mode .gcal-day:hover{background:#f8f9fb;}
body.light-mode .gcal-corner,body.light-mode .gcal-time-col,body.light-mode .gcal-week-header{background:#f8f9fb;}
body.light-mode .gcal-week-col{background:#ffffff;}
body.light-mode .gcal-hour-line{background:rgba(0,0,0,.05);}
body.light-mode .gcal-time-lbl{border-bottom-color:rgba(0,0,0,.05);}
@keyframes cardEnter{0%{opacity:0;transform:translateY(22px) scale(.98);}100%{opacity:1;transform:translateY(0) scale(1);}}
@keyframes rowEnter{from{opacity:0;transform:translateX(-10px);}to{opacity:1;transform:translateX(0);}}
@keyframes rippleGo{to{transform:scale(4);opacity:0;}}
@keyframes loadSlide{0%{width:0;left:0;}50%{width:65%;left:17%;}100%{width:0;left:100%;}}
@keyframes toastIn{from{opacity:0;transform:translateX(110%) scale(.9);}to{opacity:1;transform:translateX(0) scale(1);}}
@keyframes toastOut{to{opacity:0;transform:translateX(110%) scale(.9);}}
@keyframes modalPop{0%{opacity:0;transform:scale(.92) translateY(14px);}60%{opacity:1;transform:scale(1.01) translateY(-2px);}100%{opacity:1;transform:scale(1) translateY(0);}}
@keyframes modalOut{to{opacity:0;transform:scale(.96) translateY(8px);}}
@keyframes focusPulse{0%{box-shadow:0 0 0 0 rgba(232,184,84,.5);}100%{box-shadow:0 0 0 3px rgba(232,184,84,.15);}}
@keyframes successPulse{0%{transform:scale(0) rotate(-45deg);opacity:0;}60%{transform:scale(1.2) rotate(0deg);}100%{transform:scale(1) rotate(0deg);opacity:1;}}
@keyframes spin360{from{transform:rotate(0);}to{transform:rotate(360deg);}}
@keyframes toastProgress{from{width:100%;}to{width:0;}}
@keyframes sendingDot{0%,80%,100%{opacity:.3;transform:translateY(0);}40%{opacity:1;transform:translateY(-3px);}}
@keyframes splashFade{0%{opacity:0;transform:scale(.9);}20%{opacity:1;transform:scale(1);}80%{opacity:1;}100%{opacity:0;transform:scale(1.05);}}
@keyframes obFadeOut{to{opacity:0;visibility:hidden;}}
@keyframes obStepIn{from{opacity:0;transform:translateX(24px);}to{opacity:1;transform:translateX(0);}}
@keyframes kpiEnter{0%{opacity:0;transform:translateY(24px) scale(.94);}60%{opacity:1;transform:translateY(-2px) scale(1.01);}100%{opacity:1;transform:translateY(0) scale(1);}}
@keyframes navEnter{0%{opacity:0;transform:translateX(-20px);}100%{opacity:1;transform:translateX(0);}}
@keyframes subEnter{0%{opacity:0;transform:translateX(-12px);}100%{opacity:1;transform:translateX(0);}}
@keyframes iconBounce{0%,100%{transform:translateY(0) rotate(0);}30%{transform:translateY(-4px) rotate(-8deg);}60%{transform:translateY(-1px) rotate(4deg);}}
@keyframes logoPop{0%{transform:scale(1);}50%{transform:scale(1.12);}100%{transform:scale(1);}}
@keyframes amberGlow{0%,100%{box-shadow:0 0 0 0 rgba(232,184,84,.35);}50%{box-shadow:0 0 20px 4px rgba(232,184,84,.12);}}
@keyframes shimmer{0%{background-position:-200% 0;}100%{background-position:200% 0;}}
@keyframes floatUp{0%{opacity:0;transform:translateY(16px);}100%{opacity:1;transform:translateY(0);}}
@keyframes tabSlide{0%{transform:translateX(-100%);}100%{transform:translateX(0);}}
@keyframes pulseSoft{0%,100%{opacity:1;}50%{opacity:.6;}}
@keyframes dotPulse{0%,100%{opacity:.4;}50%{opacity:1;}}
@keyframes orbFloat1{0%,100%{transform:translate(0,0) scale(1);}33%{transform:translate(40px,-30px) scale(1.05);}66%{transform:translate(-30px,20px) scale(.98);}}
@keyframes orbFloat2{0%,100%{transform:translate(0,0) scale(1);}50%{transform:translate(-50px,40px) scale(1.08);}}
@keyframes chartDraw{from{stroke-dashoffset:1400;}to{stroke-dashoffset:0;}}
@keyframes calFadeIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
@keyframes calDayIn{from{opacity:0;transform:scale(.96);}to{opacity:1;transform:scale(1);}}
@keyframes calEvIn{from{opacity:0;transform:translateX(-4px);}to{opacity:1;transform:translateX(0);}}
@keyframes calPulse{0%,100%{box-shadow:0 2px 8px rgba(232,184,84,.4);}50%{box-shadow:0 2px 14px rgba(232,184,84,.8);}}
.kpi,.card,.tbl-row,.total-strip,.btn,.nav-item,.sub-item,.about-card,.hero,.tbl-head{transition:transform .35s cubic-bezier(.2,.9,.3,1),box-shadow .35s cubic-bezier(.2,.9,.3,1),border-color .3s ease,background .3s ease,color .25s ease,opacity .3s ease;}
.ripple{position:absolute;border-radius:50%;pointer-events:none;background:radial-gradient(circle,rgba(255,255,255,.55) 0%,rgba(255,255,255,.15) 40%,transparent 70%);transform:scale(0);animation:rippleGo .65s cubic-bezier(.2,.9,.3,1);z-index:100;}
.btn,.btn-refresh,.btn-create-top,.s-clear,.nav-item,.sub-item,.tbl-row.clickable{position:relative;overflow:hidden;}
#loadingbar{position:fixed;top:0;left:0;height:2px;background:linear-gradient(90deg,transparent,var(--amber) 20%,var(--gold) 50%,var(--amber) 80%,transparent);z-index:9999;box-shadow:0 0 12px var(--amber);animation:loadSlide 1.1s cubic-bezier(.4,0,.6,1) infinite;pointer-events:none;}
#toasts{position:fixed;bottom:48px;right:22px;z-index:9998;display:flex;flex-direction:column;gap:10px;pointer-events:none;}
.toast{min-width:280px;max-width:400px;pointer-events:auto;padding:14px 16px;border-radius:9px;background:linear-gradient(180deg,#26262f 0%,#14141a 100%);border:1px solid var(--border);box-shadow:0 12px 28px rgba(0,0,0,.75);animation:toastIn .55s cubic-bezier(.2,.9,.3,1.35) both;display:flex;gap:12px;align-items:flex-start;position:relative;overflow:hidden;}
.toast.out{animation:toastOut .35s ease-in forwards;}
.toast-ico{width:34px;height:34px;border-radius:50%;flex:0 0 34px;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;animation:successPulse .55s cubic-bezier(.2,.9,.3,1.5) both;}
.toast.green .toast-ico{background:linear-gradient(180deg,#2a5539,#0e1e14);color:#b8f5ce;border:1px solid var(--green);}
.toast.red .toast-ico{background:linear-gradient(180deg,#4a1e1e,#140a0a);color:#ffb8b8;border:1px solid var(--red);}
.toast.blue .toast-ico{background:linear-gradient(180deg,#22406a,#0c182a);color:#b8dcff;border:1px solid var(--blue);}
.toast.amber .toast-ico{background:linear-gradient(180deg,#4a3c1e,#14100a);color:#f4d99b;border:1px solid var(--amber);}
.toast-body{flex:1;min-width:0;}
.toast-title{font-size:13px;font-weight:700;color:var(--text);margin-bottom:3px;}
.toast-msg{font-size:11.5px;color:var(--muted);line-height:1.5;word-wrap:break-word;}
.toast-close{background:transparent;border:none;color:var(--muted-2);font-size:14px;padding:2px 4px;cursor:pointer;}
.toast-progress{position:absolute;bottom:0;left:0;height:2px;background:linear-gradient(90deg,var(--amber),var(--gold));animation:toastProgress 3.5s linear forwards;}
.overlay{position:fixed;inset:0;background:rgba(2,2,5,0);backdrop-filter:blur(0);transition:background .3s ease,backdrop-filter .3s ease;display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;overflow:hidden;}
.overlay.show{background:rgba(2,2,5,.82);backdrop-filter:blur(6px);}
.modal{position:relative;background:linear-gradient(180deg,#2a2a35 0%,#1a1a22 45%,#0e0e14 100%);border:1px solid var(--border-2);border-radius:10px;box-shadow:0 30px 80px rgba(0,0,0,.9);max-height:88vh;display:flex;flex-direction:column;animation:modalPop .4s cubic-bezier(.2,.9,.3,1.2) both;min-width:340px;max-width:94vw;overflow:hidden;}
.overlay.closing .modal{animation:modalOut .22s ease-in forwards;}
#splash{position:fixed;inset:0;background:var(--bg);z-index:99999;display:flex;align-items:center;justify-content:center;animation:splashFade 1.6s ease-out forwards;pointer-events:none;}
#splash .sp-logo{width:80px;height:80px;border-radius:18px;background:linear-gradient(160deg,#4a3c1e 0%,#2e2412 45%,#1a1308 100%);border:2px solid #8a6c2e;box-shadow:0 0 60px rgba(232,184,84,.6);display:flex;align-items:center;justify-content:center;font-size:44px;font-weight:700;color:var(--gold);text-shadow:0 0 24px rgba(244,217,155,.8);animation:logoPop 1.5s ease-in-out infinite;}
#topbar{position:fixed;top:0;left:0;right:0;height:var(--topbar-h);background:linear-gradient(180deg,#14141b 0%,#0a0a10 60%,#07070c 100%);border-bottom:1px solid #1a1a22;box-shadow:0 3px 12px rgba(0,0,0,.6);z-index:40;}
.logo-zone{position:absolute;left:16px;top:12px;width:28px;height:28px;}
.logo-glow{position:absolute;left:-10px;top:-10px;width:48px;height:48px;border-radius:50%;background:radial-gradient(circle,rgba(232,184,84,.45) 0%,transparent 70%);pointer-events:none;animation:amberGlow 3s ease-in-out infinite;}
.logo{position:absolute;inset:0;border-radius:7px;background:linear-gradient(180deg,#4a3c1e 0%,#2e2412 45%,#1a1308 100%);border:1px solid #8a6c2e;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;color:var(--gold);}
.searchbox{position:absolute;left:50%;top:12px;transform:translateX(-50%);width:380px;height:28px;border-radius:7px;background:linear-gradient(180deg,#1a1a22 0%,#0a0a10 100%);border:1px solid var(--border);display:flex;align-items:center;cursor:pointer;padding:0 10px;gap:10px;transition:border-color .3s,box-shadow .3s;}
.qmark{width:18px;height:18px;border-radius:50%;flex:0 0 18px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:var(--muted);background:#22222c;border:1px solid #2e2e3a;}
.stxt{flex:1;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.stxt.filter{color:var(--amber);font-weight:600;}
.s-clear{height:20px;padding:0 8px;border-radius:5px;font-size:10px;font-weight:700;background:#3a2e18;border:1px solid var(--amber);color:var(--amber);}
.top-right{position:absolute;right:20px;top:12px;display:flex;gap:8px;}
.btn-refresh{width:34px;height:28px;border-radius:7px;background:linear-gradient(180deg,#22222c 0%,#131319 100%);border:1px solid var(--border);color:var(--muted);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;}
.btn-refresh.spin{animation:spin360 .6s;}
.btn-create-top{height:28px;padding:0 16px;border-radius:7px;background:linear-gradient(180deg,#2a5539 0%,#0e1e14 100%);border:1px solid var(--green);color:#b8f5ce;font-size:12px;font-weight:700;}
#sidebar{position:fixed;top:var(--topbar-h);left:0;width:var(--sidebar-w);bottom:0;background:linear-gradient(180deg,#0a0a10 0%,#06060a 100%);border-right:1px solid #16161c;overflow-y:auto;overflow-x:hidden;padding:6px 0 20px;z-index:30;}
.nav-group{font-size:9.5px;font-weight:700;letter-spacing:1.4px;color:#4a4a56;text-transform:uppercase;padding:14px 22px 6px;}
.nav-group:first-child{padding-top:10px;}
.nav-item{position:relative;height:34px;cursor:pointer;display:flex;align-items:center;overflow:hidden;animation:navEnter .4s cubic-bezier(.2,.9,.3,1.2) both;}
.nav-item:hover{background:rgba(255,255,255,.04);}
.nav-item.active{margin:0 8px;width:calc(100% - 16px);border-radius:8px;background:linear-gradient(180deg,#4a3c1e 0%,#14100a 100%);border:1px solid var(--amber);box-shadow:0 4px 14px rgba(232,184,84,.15);}
.nav-item.active::before{content:'';position:absolute;left:-9px;top:4px;bottom:4px;width:3px;background:linear-gradient(180deg,var(--gold),var(--amber));border-radius:0 2px 2px 0;}
.nav-ico{width:22px;height:22px;border-radius:6px;flex:0 0 22px;margin-left:14px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;background:#1a1a22;border:1px solid #2e2e3a;color:var(--muted);}
.nav-item.active .nav-ico{background:#5a4a24;border-color:var(--amber);color:var(--gold);}
.nav-item:hover .nav-ico{animation:iconBounce .6s cubic-bezier(.2,.9,.3,1.5);}
.nav-lbl{margin-left:10px;font-size:12.5px;color:var(--muted);white-space:nowrap;}
.nav-item.active .nav-lbl{color:var(--gold);font-weight:600;}
.nav-item:hover .nav-lbl{color:var(--text);}
.sub-item{height:24px;cursor:pointer;display:flex;align-items:center;animation:subEnter .4s cubic-bezier(.2,.9,.3,1.2) both;}
.sub-item:hover{background:rgba(255,255,255,.03);}
.sub-dot{width:4px;height:4px;border-radius:50%;background:#5e5e68;margin-left:26px;flex:0 0 4px;}
.sub-lbl{margin-left:8px;font-size:11.5px;color:var(--muted-2);white-space:nowrap;}
.sub-item.active .sub-dot{background:var(--amber);box-shadow:0 0 8px rgba(232,184,84,.9);}
.sub-item.active .sub-lbl{color:var(--gold);font-weight:600;}
.sub-item:hover .sub-lbl{color:#b8b8c4;}
.nav-badge{margin-left:auto;margin-right:12px;background:#3a2e18;border:1px solid var(--amber);color:var(--amber);font-size:9px;font-weight:700;padding:1px 6px;border-radius:20px;}
#content{position:fixed;top:var(--topbar-h);left:var(--sidebar-w);right:0;bottom:0;overflow-y:auto;padding:32px 36px 80px;background:radial-gradient(ellipse 900px 500px at 15% 0%,rgba(232,184,84,.06) 0%,transparent 60%),radial-gradient(ellipse 800px 500px at 85% 20%,rgba(168,137,232,.05) 0%,transparent 60%),#06060a;}
#content::before{content:'';position:fixed;top:52px;left:196px;width:320px;height:320px;border-radius:50%;background:radial-gradient(circle,rgba(232,184,84,.15) 0%,transparent 70%);filter:blur(50px);pointer-events:none;z-index:0;animation:orbFloat1 22s ease-in-out infinite;}
#content::after{content:'';position:fixed;bottom:60px;right:80px;width:360px;height:360px;border-radius:50%;background:radial-gradient(circle,rgba(168,137,232,.13) 0%,transparent 70%);filter:blur(60px);pointer-events:none;z-index:0;animation:orbFloat2 26s ease-in-out infinite;}
#content > *{position:relative;z-index:1;}
.page-greet{font-size:32px;font-weight:700;letter-spacing:-.9px;line-height:1.1;animation:floatUp .6s cubic-bezier(.2,.9,.3,1.1) both;background:linear-gradient(135deg,#ffffff 0%,#e8e8f0 45%,#b8b8c8 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;}
body.light-mode .page-greet{background:linear-gradient(135deg,#181820 0%,#3a3a44 45%,#5a5a68 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;}
.page-sub{font-size:13px;color:var(--muted);margin-top:6px;animation:floatUp .6s cubic-bezier(.2,.9,.3,1.1) both;animation-delay:.08s;display:flex;align-items:center;gap:9px;}
.page-sub .dot{width:6px;height:6px;border-radius:50%;background:var(--amber);animation:dotPulse 2.2s ease-in-out infinite;}
.page-h1{font-size:18px;font-weight:700;letter-spacing:-.2px;display:flex;align-items:center;gap:8px;}
.page-h2{font-size:14px;font-weight:700;}
.kpi-grid{display:grid;gap:16px;margin-top:26px;}
.kpi-grid.g5{grid-template-columns:repeat(5,1fr);}
.kpi-grid.g4{grid-template-columns:repeat(4,1fr);}
.kpi-grid.g3{grid-template-columns:repeat(3,1fr);}
@media(max-width:1400px){.kpi-grid.g5{grid-template-columns:repeat(3,1fr);}}
@media(max-width:900px){.kpi-grid.g5,.kpi-grid.g4,.kpi-grid.g3{grid-template-columns:repeat(2,1fr);}}
.kpi{position:relative;height:148px;border-radius:14px;background:linear-gradient(160deg,rgba(30,30,40,.85) 0%,rgba(12,12,18,.92) 100%);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.07);overflow:hidden;cursor:pointer;animation:kpiEnter .55s cubic-bezier(.2,.9,.3,1.2) both;box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 2px 8px rgba(0,0,0,.5);}
.kpi-ambient{position:absolute;top:-70px;right:-70px;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,var(--glow-color,rgba(232,184,84,.25)) 0%,transparent 65%);opacity:.9;transition:opacity .5s,transform .8s;pointer-events:none;filter:blur(4px);}
.kpi::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.04) 0%,transparent 45%);pointer-events:none;border-radius:14px;}
.kpi:hover{transform:translateY(-4px);border-color:rgba(255,255,255,.14);box-shadow:inset 0 1px 0 rgba(255,255,255,.1),0 20px 40px rgba(0,0,0,.65),0 0 0 1px var(--glow-color,rgba(232,184,84,.25));}
.kpi:hover .kpi-ambient{opacity:1;transform:scale(1.15);}
.kpi .bar{position:absolute;left:0;top:14px;bottom:14px;width:3px;border-radius:0 3px 3px 0;transition:all .35s cubic-bezier(.2,.9,.3,1.2);}
.kpi:hover .bar{top:8px;bottom:8px;box-shadow:0 0 16px currentColor;width:4px;}
.kpi-top{position:absolute;left:18px;right:18px;top:16px;display:flex;align-items:center;justify-content:space-between;z-index:3;}
.kpi-label{font-size:10px;font-weight:700;letter-spacing:1.4px;color:var(--muted);text-transform:uppercase;}
.kpi:hover .kpi-label{color:var(--text);}
.kpi-icon{font-size:16px;opacity:.55;transition:opacity .35s,transform .45s cubic-bezier(.2,.9,.3,1.3);filter:saturate(.8);}
.kpi:hover .kpi-icon{opacity:1;transform:scale(1.18) rotate(-8deg);filter:saturate(1.2);}
.kpi-value{position:absolute;left:18px;right:18px;top:42px;font-size:28px;font-weight:700;color:#fff;line-height:1.05;letter-spacing:-0.035em;white-space:nowrap;overflow:hidden;z-index:3;text-shadow:0 1px 3px rgba(0,0,0,.4);}
.kpi-spark{position:absolute;left:0;right:0;bottom:0;height:52px;width:100%;z-index:2;opacity:.85;transition:opacity .35s;pointer-events:none;}
.kpi:hover .kpi-spark{opacity:1;}
.kpi-spark path.spark-line{stroke-width:1.8;fill:none;stroke-linecap:round;stroke-linejoin:round;animation:chartDraw 1.6s cubic-bezier(.2,.9,.3,1.1) forwards;stroke-dasharray:1400;}
.kpi-spark path.spark-area{stroke:none;opacity:.35;}
.kpi-footer{position:absolute;left:18px;right:18px;bottom:14px;display:flex;align-items:center;justify-content:space-between;z-index:3;font-size:10.5px;}
.kpi-trend{display:inline-flex;align-items:center;gap:3px;font-weight:700;font-size:10px;padding:2px 7px;border-radius:20px;letter-spacing:.2px;}
.kpi-trend.up{color:var(--green);background:rgba(86,212,136,.12);border:1px solid rgba(86,212,136,.25);}
.kpi-trend.down{color:var(--red);background:rgba(240,106,106,.12);border:1px solid rgba(240,106,106,.25);}
.kpi-trend.flat{color:var(--muted);background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);}
.kpi-note{color:var(--muted-2);font-size:10.5px;}
.card{position:relative;border-radius:14px;background:linear-gradient(160deg,rgba(28,28,36,.82) 0%,rgba(12,12,18,.92) 100%);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.07);overflow:hidden;animation:cardEnter .65s cubic-bezier(.2,.9,.3,1.1) both;animation-delay:.25s;box-shadow:inset 0 1px 0 rgba(255,255,255,.05),0 2px 8px rgba(0,0,0,.4);}
.card::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.025) 0%,transparent 35%);pointer-events:none;border-radius:14px;}
.card:hover{border-color:rgba(255,255,255,.12);box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 12px 32px rgba(0,0,0,.55);}
.card-hd{font-size:14.5px;font-weight:700;color:var(--text);display:flex;align-items:center;gap:8px;letter-spacing:-.15px;}
.card-hd .ico{font-size:15px;}
.card-sub{font-size:11.5px;color:var(--muted);margin-top:4px;letter-spacing:.1px;}
.row{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start;}
.grow{flex:1;min-width:0;}
.mt14{margin-top:14px;}
.mt18{margin-top:18px;}
.chart-wrap{position:relative;width:100%;height:240px;padding:0 8px 0;margin-top:18px;}
.chart-svg{width:100%;height:100%;overflow:visible;}
.chart-grid line{stroke:rgba(255,255,255,.045);stroke-width:1;stroke-dasharray:3 4;}
.chart-area-fill{animation:chartDraw 1.8s cubic-bezier(.2,.9,.3,1.1) forwards;}
.chart-line{fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;animation:chartDraw 1.8s cubic-bezier(.2,.9,.3,1.1) forwards;stroke-dasharray:1400;}
.chart-dot{fill:#0c0c12;stroke-width:2.5;opacity:0;transition:r .25s;}
.chart-dot.show{opacity:1;}
.chart-dot:hover,.chart-dot.active{r:6;stroke-width:3;}
.chart-hover-line{stroke:rgba(232,184,84,.5);stroke-width:1;stroke-dasharray:2 3;opacity:0;transition:opacity .2s;pointer-events:none;}
.chart-x-labels{display:flex;justify-content:space-between;padding:8px 12px 0;}
.chart-x-labels span{font-size:11px;color:var(--muted);font-weight:600;}
.chart-tooltip{position:absolute;background:linear-gradient(180deg,#26262f,#0c0c12);border:1px solid rgba(232,184,84,.4);border-radius:9px;padding:8px 12px;font-size:11.5px;color:var(--text);pointer-events:none;opacity:0;transition:opacity .2s,transform .2s;box-shadow:0 12px 32px rgba(0,0,0,.7);white-space:nowrap;z-index:10;transform:translate(-50%,-115%);}
.chart-tooltip.show{opacity:1;}
.chart-tooltip b{color:var(--gold);font-weight:700;}
.chart-tooltip .tt-date{font-size:10px;color:var(--muted);margin-bottom:3px;letter-spacing:.5px;text-transform:uppercase;font-weight:600;}
.cash-rings{display:flex;justify-content:space-around;align-items:flex-start;gap:12px;margin-top:24px;}
.cash-ring-item{display:flex;flex-direction:column;align-items:center;gap:10px;flex:1;}
.cash-ring-wrap{position:relative;width:90px;height:90px;}
.cash-ring-svg{width:90px;height:90px;}
.cash-ring-svg circle{transition:stroke-dashoffset 1.4s cubic-bezier(.2,.9,.3,1.1);}
.cash-ring-center{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;letter-spacing:-.5px;}
.cash-ring-label{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;font-weight:700;text-align:center;}
.cash-ring-value{font-size:12.5px;font-weight:700;letter-spacing:-.2px;margin-top:3px;text-align:center;}
.cash-ring-value.green{color:var(--green);}
.cash-ring-value.red{color:var(--red);}
.cash-ring-value.blue{color:var(--blue);}
.tbl{margin-top:4px;}
.tbl-head{display:flex;align-items:center;height:30px;padding:0 16px;background:linear-gradient(180deg,rgba(22,22,30,.9) 0%,rgba(12,12,18,.9) 100%);border:1px solid rgba(255,255,255,.05);border-radius:9px;font-size:10px;font-weight:700;letter-spacing:1px;color:var(--muted);text-transform:uppercase;}
.tbl-row{display:flex;align-items:center;height:38px;padding:0 16px;margin-top:5px;background:linear-gradient(180deg,rgba(26,26,34,.7) 0%,rgba(13,13,20,.7) 100%);border:1px solid rgba(255,255,255,.05);border-radius:10px;font-size:12.5px;animation:rowEnter .45s cubic-bezier(.2,.9,.3,1.2) both;box-shadow:inset 0 1px 0 rgba(255,255,255,.02);transition:all .3s;}
.tbl-row.clickable{cursor:pointer;}
.tbl-row.clickable:hover{border-color:rgba(232,184,84,.4);background:linear-gradient(90deg,rgba(232,184,84,.06) 0%,rgba(28,28,36,.9) 40%);transform:translateX(5px);box-shadow:-3px 0 0 var(--amber),0 8px 20px rgba(0,0,0,.5);}
.tbl-row:hover .td{color:var(--text);}
.th,.td{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:12px;transition:color .25s;}
.th.flex,.td.flex{flex:1;min-width:0;}
.td.right,.th.right{text-align:right;padding-right:0;}
.client-cell{display:flex;align-items:center;gap:9px;}
.client-av{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:9.5px;font-weight:700;color:#fff;flex:0 0 24px;text-shadow:0 1px 2px rgba(0,0,0,.4);box-shadow:inset 0 1px 0 rgba(255,255,255,.2);}
.status-pill{display:inline-flex;align-items:center;gap:5px;padding:3px 11px;border-radius:20px;font-size:10px;font-weight:700;border:1px solid;letter-spacing:.4px;}
.status-pill.sent,.status-pill.Paid,.status-pill.Active,.status-pill.Matched{color:var(--green);border-color:rgba(86,212,136,.4);background:rgba(86,212,136,.1);}
.status-pill.failed,.status-pill.Overdue,.status-pill.Inactive{color:var(--red);border-color:rgba(240,106,106,.4);background:rgba(240,106,106,.1);}
.status-pill.new,.status-pill.Pending,.status-pill.Draft,.status-pill.Sent{color:var(--blue);border-color:rgba(102,176,238,.4);background:rgba(102,176,238,.1);}
.status-pill.Partial,.status-pill.Open,.status-pill.Received{color:var(--amber);border-color:rgba(232,184,84,.4);background:rgba(232,184,84,.1);}
.status-pill::before{content:'';width:5px;height:5px;border-radius:50%;background:currentColor;box-shadow:0 0 6px currentColor;}
.btn{height:30px;padding:0 14px;border-radius:8px;font-size:12px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--border);color:var(--muted);background:linear-gradient(180deg,#26262f 0%,#14141a 100%);white-space:nowrap;position:relative;overflow:hidden;}
.btn:hover{color:var(--text);border-color:var(--border-2);transform:translateY(-2px);box-shadow:0 6px 16px rgba(0,0,0,.5);}
.btn.green{background:linear-gradient(180deg,#2a5539 0%,#0e1e14 100%);border-color:var(--green);color:#b8f5ce;}
.btn.blue{background:linear-gradient(180deg,#22406a 0%,#0c182a 100%);border-color:var(--blue);color:#b8dcff;}
.btn.amber{background:linear-gradient(180deg,#4a3c1e 0%,#14100a 100%);border-color:var(--amber);color:#f4d99b;}
.btn.red{background:linear-gradient(180deg,#4a1e1e 0%,#140a0a 100%);border-color:var(--red);color:#ffb8b8;}
.btn.ghost{background:linear-gradient(180deg,#22222c,#101016);}
.empty{margin-top:14px;min-height:150px;border-radius:12px;background:linear-gradient(160deg,rgba(26,26,34,.7),rgba(12,12,18,.9));border:1px solid rgba(255,255,255,.05);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;animation:cardEnter .6s cubic-bezier(.2,.9,.3,1.1) both;}
.empty h3{font-size:15px;font-weight:700;color:var(--text);}
.empty p{font-size:12px;color:var(--muted);margin:8px 0 16px;}
.field{display:block;margin-bottom:12px;}
.field span{display:block;font-size:11px;font-weight:600;color:var(--muted);margin-bottom:5px;}
.field input,.field select,.field textarea{width:100%;height:30px;padding:0 10px;border-radius:6px;font-family:inherit;font-size:12px;background:#0a0a10;border:1px solid var(--border);color:var(--text);outline:none;}
.field textarea{height:80px;padding:8px 10px;resize:vertical;line-height:1.6;}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--amber);box-shadow:0 0 0 3px rgba(232,184,84,.1);}
.modal-title{padding:14px 18px 10px;font-size:14px;font-weight:700;border-bottom:1px solid rgba(255,255,255,.06);}
.modal-body{padding:16px 18px;overflow-y:auto;}
.modal-actions{padding:12px 18px 14px;display:flex;justify-content:flex-end;gap:8px;border-top:1px solid rgba(255,255,255,.06);}
.action-list{display:flex;flex-direction:column;gap:8px;min-width:270px;}
.action-list .btn{justify-content:flex-start;width:100%;height:34px;padding:0 13px;}
.mono{font-family:Consolas,monospace;font-size:11.5px;line-height:1.55;white-space:pre-wrap;word-break:break-word;color:#c0c0cc;}
textarea.mono{width:100%;height:320px;background:#0a0a10;border:1px solid var(--border);border-radius:6px;padding:10px;color:#c0c0cc;outline:none;resize:vertical;font-family:Consolas,monospace;font-size:11.5px;}
.email-composer .modal-body{padding:14px 18px;max-height:70vh;}
.email-composer textarea.email-body{min-height:180px;padding:12px;line-height:1.65;font-size:12.5px;}
.composer-meta{display:flex;gap:8px;align-items:center;padding:8px 12px;margin-bottom:14px;background:rgba(232,184,84,.08);border:1px solid rgba(232,184,84,.25);border-radius:7px;font-size:11.5px;color:var(--muted);}
.composer-meta b{color:var(--gold);}
.composer-meta .ico{width:22px;height:22px;border-radius:50%;flex:0 0 22px;display:flex;align-items:center;justify-content:center;font-size:11px;background:#5a4a24;color:var(--gold);border:1px solid var(--amber);}
.sending-dots{display:inline-flex;gap:4px;margin-left:4px;}
.sending-dots span{width:5px;height:5px;border-radius:50%;background:#b8f5ce;animation:sendingDot 1.4s ease-in-out infinite;}
.sending-dots span:nth-child(2){animation-delay:.2s;}
.sending-dots span:nth-child(3){animation-delay:.4s;}
.about-card{position:relative;background:linear-gradient(160deg,rgba(30,30,40,.82),rgba(12,12,18,.9));backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.06);border-radius:14px;padding:16px 20px 18px;flex:1;min-width:240px;animation:cardEnter .7s cubic-bezier(.2,.9,.3,1.1) both;}
.about-card .accent{position:absolute;left:0;top:16px;width:3px;height:36px;border-radius:0 2px 2px 0;}
.about-card h4{margin:0 0 10px 14px;font-size:14px;font-weight:700;}
.about-card pre{margin:0;font-family:inherit;font-size:12px;line-height:1.75;color:#c4c4d0;white-space:pre-wrap;}
.hero{background:linear-gradient(160deg,#4a3c1e 0%,#2e2412 40%,#181208 100%);border:1px solid #8a6c2e;border-radius:14px;padding:20px 26px;animation:cardEnter .7s cubic-bezier(.2,.9,.3,1.1) both;animation-delay:.15s;position:relative;overflow:hidden;}
.hero::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent 30%,rgba(255,220,150,.1) 50%,transparent 70%);background-size:200% 100%;animation:shimmer 4s ease-in-out infinite;pointer-events:none;}
.total-strip{border-radius:10px;height:40px;display:flex;align-items:center;padding:0 18px;font-size:14px;font-weight:700;animation:cardEnter .6s cubic-bezier(.2,.9,.3,1.1) both;transition:transform .35s;}
.total-strip:hover{transform:translateX(4px);}
.total-strip.green{background:linear-gradient(180deg,rgba(30,58,40,.85),rgba(10,24,16,.85));border:1px solid rgba(86,212,136,.35);color:#a8ecc4;}
.total-strip.red{background:linear-gradient(180deg,rgba(58,24,24,.85),rgba(20,10,10,.85));border:1px solid rgba(240,106,106,.35);color:#ffb8b8;}
.total-strip.blue{background:linear-gradient(180deg,rgba(26,48,80,.85),rgba(12,24,42,.85));border:1px solid rgba(102,176,238,.35);color:#b8dcff;}
.total-strip.amber{background:linear-gradient(180deg,rgba(58,46,22,.85),rgba(20,16,10,.85));border:1px solid rgba(232,184,84,.35);color:#f4d99b;}
.theme-btn{padding:14px 10px;border-radius:10px;background:linear-gradient(160deg,rgba(30,30,40,.85),rgba(12,12,18,.9));border:1px solid rgba(255,255,255,.08);color:var(--text);display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer;transition:all .25s;font-size:11.5px;font-weight:600;}
.theme-btn:hover{transform:translateY(-3px);border-color:rgba(255,255,255,.18);box-shadow:0 8px 20px rgba(0,0,0,.4);}
.theme-btn.active{border-color:var(--amber);box-shadow:0 0 0 2px rgba(232,184,84,.25),0 8px 20px rgba(0,0,0,.4);}
.theme-swatch{width:36px;height:36px;border-radius:50%;box-shadow:inset 0 2px 4px rgba(255,255,255,.15),0 2px 8px rgba(0,0,0,.4);}
#onboarding{position:fixed;inset:0;z-index:99999;background:radial-gradient(circle at 50% 30%,#1a1a22 0%,#06060a 70%);display:flex;align-items:center;justify-content:center;padding:20px;}
#onboarding.out{animation:obFadeOut .5s ease forwards;}
.ob-container{width:100%;max-width:480px;animation:cardEnter .7s cubic-bezier(.2,.9,.3,1.1) both;}
.ob-card{background:linear-gradient(180deg,#2a2a35 0%,#0e0e14 100%);border:1px solid var(--border-2);border-radius:16px;padding:32px 36px 28px;box-shadow:0 30px 80px rgba(0,0,0,.9);}
.ob-logo{width:80px;height:80px;margin:0 auto 20px;border-radius:18px;background:linear-gradient(160deg,#4a3c1e 0%,#1a1308 100%);border:2px solid #8a6c2e;display:flex;align-items:center;justify-content:center;font-size:44px;font-weight:700;color:var(--gold);text-shadow:0 0 24px rgba(244,217,155,.8);animation:logoPop 2.5s ease-in-out infinite;}
.ob-step{display:none;}
.ob-step.active{display:block;animation:obStepIn .5s cubic-bezier(.2,.9,.3,1.2) both;}
.ob-h1{font-size:24px;font-weight:700;text-align:center;letter-spacing:-.4px;margin-bottom:8px;}
.ob-sub{font-size:13px;color:var(--muted);text-align:center;line-height:1.6;margin-bottom:24px;}
.ob-progress{display:flex;gap:6px;justify-content:center;margin-bottom:24px;}
.ob-progress span{width:40px;height:4px;border-radius:2px;background:#2e2e3a;transition:all .4s cubic-bezier(.2,.9,.3,1.2);}
.ob-progress span.done{background:linear-gradient(90deg,var(--amber),var(--gold));}
.ob-progress span.current{background:var(--amber);animation:pulseSoft 1.5s ease-in-out infinite;}
.ob-field{display:block;margin-bottom:16px;}
.ob-field span{display:block;font-size:11px;font-weight:700;letter-spacing:.5px;color:var(--muted);margin-bottom:6px;text-transform:uppercase;}
.ob-field input{width:100%;height:44px;padding:0 14px;border-radius:8px;font-family:inherit;font-size:14px;background:#0a0a10;border:1px solid var(--border);color:var(--text);outline:none;}
.ob-field input:focus{border-color:var(--amber);box-shadow:0 0 0 3px rgba(232,184,84,.12);}
.ob-actions{display:flex;gap:10px;margin-top:24px;}
.ob-actions .btn{flex:1;height:46px;font-size:14px;font-weight:700;border-radius:8px;}
.ob-success{text-align:center;padding:20px 0;}
.ob-success .check{width:80px;height:80px;margin:0 auto 20px;border-radius:50%;background:#0e1e14;border:2px solid var(--green);display:flex;align-items:center;justify-content:center;font-size:40px;color:#b8f5ce;animation:successPulse .6s cubic-bezier(.2,.9,.3,1.5) both;}
.ob-loader{width:40px;height:40px;margin:20px auto;border:3px solid rgba(232,184,84,.2);border-top-color:var(--amber);border-radius:50%;animation:spin360 1s linear infinite;}
@media(max-width:1100px){.searchbox{width:240px;}}
@media(max-width:900px){.searchbox{display:none;}:root{--sidebar-w:64px;}.nav-lbl,.sub-lbl,.nav-badge,.nav-group{display:none;}}
.gcal{display:flex;flex-direction:column;}
.gcal-header{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:16px;}
.gcal-nav{display:flex;align-items:center;gap:8px;}
.gcal-title{font-size:20px;font-weight:600;min-width:180px;}
.gcal-viewsw{display:flex;background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:8px;padding:3px;}
.gcal-viewsw button{padding:6px 14px;border-radius:6px;background:transparent;border:none;color:var(--muted);font-size:11.5px;font-weight:600;transition:all .2s;}
.gcal-viewsw button.active{background:var(--amber);color:#0a0a10;}
.gcal-navbtn{width:32px;height:32px;border-radius:50%;background:transparent;border:1px solid var(--border);color:var(--muted);display:flex;align-items:center;justify-content:center;font-size:14px;}
.gcal-today-btn{padding:6px 14px;border-radius:6px;background:transparent;border:1px solid var(--border);color:var(--muted);font-size:11.5px;font-weight:600;}
.gcal-legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--muted);margin-bottom:14px;}
.gcal-legend span{display:inline-flex;align-items:center;gap:6px;}
.gcal-legend .dot{width:8px;height:8px;border-radius:50%;box-shadow:0 0 6px currentColor;}
.gcal-month{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:var(--border);border:1px solid var(--border);border-radius:12px;overflow:hidden;animation:calFadeIn .5s ease both;}
.gcal-weekday{background:var(--panel);padding:10px 4px;text-align:center;font-size:10.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:1px;}
.gcal-day{background:var(--bg);padding:6px;position:relative;min-height:100px;overflow:hidden;cursor:pointer;transition:background .2s;animation:calDayIn .4s cubic-bezier(.2,.9,.3,1.2) both;}
.gcal-day:hover{background:rgba(255,255,255,.03);}
.gcal-day.out{opacity:.35;}
.gcal-day-num{font-size:12.5px;font-weight:600;width:26px;height:26px;display:flex;align-items:center;justify-content:center;border-radius:50%;margin-bottom:4px;}
.gcal-day.today .gcal-day-num{background:var(--amber);color:#0a0a10;font-weight:700;box-shadow:0 2px 8px rgba(232,184,84,.4);animation:calPulse 2s ease-in-out infinite;}
.gcal-ev{font-size:10.5px;padding:2px 6px;border-radius:4px;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#fff;font-weight:600;cursor:pointer;}
.gcal-ev:hover{transform:translateX(2px);}
.gcal-more{font-size:9.5px;color:var(--muted);font-weight:600;padding-left:4px;}
.gcal-week{display:grid;grid-template-columns:62px repeat(7,1fr);background:var(--border);border:1px solid var(--border);border-radius:12px;overflow:hidden;animation:calFadeIn .5s ease both;max-height:600px;overflow-y:auto;}
.gcal-week.day-mode{grid-template-columns:62px 1fr;}
.gcal-corner{background:var(--panel);border-bottom:1px solid var(--border);}
.gcal-time-col{background:var(--panel);display:flex;flex-direction:column;}
.gcal-time-lbl{height:52px;font-size:10px;color:var(--muted);text-align:right;padding:2px 8px 0 0;font-weight:600;border-bottom:1px solid rgba(255,255,255,.03);}
.gcal-week-header{background:var(--panel);padding:8px 4px;text-align:center;font-size:10.5px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.8px;border-bottom:1px solid var(--border);border-left:1px solid rgba(255,255,255,.03);}
.gcal-week-header .d{display:block;font-size:18px;font-weight:700;color:var(--text);margin-top:2px;}
.gcal-week-header.today .d{color:var(--amber);}
.gcal-week-col{background:var(--bg);position:relative;height:1248px;border-left:1px solid rgba(255,255,255,.03);}
.gcal-hour-line{position:absolute;left:0;right:0;height:1px;background:rgba(255,255,255,.03);}
.gcal-week-ev{position:absolute;left:3px;right:3px;border-radius:5px;padding:3px 6px;font-size:10.5px;font-weight:600;color:#fff;overflow:hidden;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.3);}
.gcal-week-ev:hover{transform:scale(1.02);box-shadow:0 4px 12px rgba(0,0,0,.5);z-index:5;}
.gcal-now-line{position:absolute;left:0;right:0;height:2px;background:#ea4335;box-shadow:0 0 8px rgba(234,67,53,.6);z-index:10;pointer-events:none;}
.gcal-now-line::before{content:'';position:absolute;left:-5px;top:-4px;width:10px;height:10px;border-radius:50%;background:#ea4335;}
</style>

<script>
"use strict";

function getThemePrefs(){try{var p=JSON.parse(localStorage.getItem(THEME_KEY)||"null");return p||{preset:"gold",mode:"light",custom:null};}catch(e){return {preset:"gold",mode:"light",custom:null};}}
function saveThemePrefs(p){try{localStorage.setItem(THEME_KEY,JSON.stringify(p));}catch(e){}}
function lightenColor(hex,amt){try{var c=String(hex).replace("#","");var r=parseInt(c.slice(0,2),16),g=parseInt(c.slice(2,4),16),b=parseInt(c.slice(4,6),16);r=Math.min(255,r+amt);g=Math.min(255,g+amt);b=Math.min(255,b+amt);return "#"+[r,g,b].map(function(x){return x.toString(16).padStart(2,"0");}).join("");}catch(e){return hex;}}
function applyThemePrefs(){var p=getThemePrefs();var t=THEME_PRESETS[p.preset]||THEME_PRESETS.gold;var accent=p.custom?p.custom:t.accent;var gold=p.custom?lightenColor(p.custom,50):t.gold;document.documentElement.style.setProperty("--amber",accent);document.documentElement.style.setProperty("--gold",gold);if(p.mode==="light")document.body.classList.add("light-mode");else document.body.classList.remove("light-mode");}
function setThemePreset(key){if(!THEME_PRESETS[key])return;var p=getThemePrefs();p.preset=key;p.custom=null;saveThemePrefs(p);applyThemePrefs();render();toast("Theme: "+THEME_PRESETS[key].name,"","green");}
function setCustomAccent(color){var p=getThemePrefs();p.custom=color;saveThemePrefs(p);applyThemePrefs();render();toast("Custom color","Applied","green");}
function playClick(){}
function playSuccess(){}
function playError(){}
function playSend(){}
function playNotify(){}
var BACKEND_URL="https://velora-email-server.mflow-velora-2026.workers.dev";
function getGmailTokens(){try{return JSON.parse(localStorage.getItem("velora_gmail_tokens")||"null");}catch(e){return null;}}
function setGmailTokens(t){try{localStorage.setItem("velora_gmail_tokens",JSON.stringify(t));}catch(e){}}
function clearGmailTokens(){try{localStorage.removeItem("velora_gmail_tokens");}catch(e){}}
function isGmailConnected(){var t=getGmailTokens();return !!(t&&t.tokens&&t.tokens.access_token);}
function getConnectedEmail(){var t=getGmailTokens();if(!t)return null;return t.email||null;}
function getConnectedDisplay(){return getConnectedEmail()||"your Gmail account";}
async function connectGmail(){try{var res=await fetch(BACKEND_URL+"/api/auth/google");var j=await res.json();if(j.url){toast("Opening Google...","","blue");setTimeout(function(){window.location.href=j.url;},400);}else{toast("Failed",j.error||"Try again","red");}}catch(e){toast("Failed",String(e.message||e),"red");}}
function disconnectGmail(){clearGmailTokens();render();toast("Disconnected","","blue");}
var ONBOARD_KEY="velora_onboarded_v1";
function isOnboarded(){try{return localStorage.getItem(ONBOARD_KEY)==="yes";}catch(e){return false;}}
function markOnboarded(){try{localStorage.setItem(ONBOARD_KEY,"yes");}catch(e){}}
function showOnboardingStep(n){var ov=document.getElementById("onboarding");if(!ov)return;ov.querySelectorAll(".ob-step").forEach(function(s){s.classList.remove("active");if(String(s.dataset.step)===String(n))s.classList.add("active");});}
function validateEmail(email){return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(String(email||"").trim());}
function initOnboarding(){var ov=document.getElementById("onboarding");if(!ov)return;if(isOnboarded()){ov.style.display="none";return;}ov.style.display="flex";ov.querySelectorAll("[data-next]").forEach(function(btn){btn.onclick=function(){showOnboardingStep(btn.dataset.next);};});ov.querySelectorAll("[data-prev]").forEach(function(btn){btn.onclick=function(){showOnboardingStep(btn.dataset.prev);};});var finishBtn=ov.querySelector(".ob-finish");if(finishBtn){finishBtn.onclick=async function(){var name=(document.getElementById("ob-name")||{}).value||"";var company=(document.getElementById("ob-company")||{}).value||"";var email=(document.getElementById("ob-email")||{}).value||"";if(!name.trim()){alertBox("Please enter your name.","Missing");return;}if(!company.trim()){alertBox("Please enter your company name.","Missing");return;}if(!validateEmail(email)){alertBox("Please enter a valid email.","Invalid");return;}DB.config.companyName=company.trim();DB.config.companyEmail=email.trim();DB.config.senderName=name.trim();DB.config.senderEmail=email.trim();saveDB();markOnboarded();showOnboardingStep("3");setTimeout(function(){ov.classList.add("out");setTimeout(function(){ov.style.display="none";render();toast("Welcome to Velora Studio!","Your dashboard is ready","green");},500);},1500);};}}
function showLoadingBar(){var bar=document.getElementById("loadingbar");if(bar)bar.remove();bar=document.createElement("div");bar.id="loadingbar";document.body.appendChild(bar);clearTimeout(bar._t);bar._t=setTimeout(function(){bar.style.transition="opacity .3s";bar.style.opacity="0";setTimeout(function(){bar.remove();},350);},700);}
function ripple(e){var el=e.currentTarget;if(!el||el.dataset.noRipple==="1")return;var rect=el.getBoundingClientRect();var size=Math.max(rect.width,rect.height)*1.6;var x=(e.clientX||rect.left+rect.width/2)-rect.left-size/2;var y=(e.clientY||rect.top+rect.height/2)-rect.top-size/2;var rip=document.createElement("span");rip.className="ripple";rip.style.width=rip.style.height=size+"px";rip.style.left=x+"px";rip.style.top=y+"px";el.appendChild(rip);setTimeout(function(){rip.remove();},700);}
function toast(title,msg,type){type=type||"green";var icons={green:"✓",red:"✕",blue:"i",amber:"!"};var box=document.getElementById("toasts");var el=document.createElement("div");el.className="toast "+type;el.innerHTML='<div class="toast-ico">'+(icons[type]||"✓")+'</div><div class="toast-body"><div class="toast-title">'+esc(title||"")+'</div>'+(msg?'<div class="toast-msg">'+esc(msg)+'</div>':'')+'</div><button class="toast-close">✕</button><div class="toast-progress"></div>';box.appendChild(el);var close=function(){el.classList.add("out");setTimeout(function(){el.remove();},360);};el.querySelector(".toast-close").onclick=close;setTimeout(close,3600);}
function fitKpiValue(el){if(!el)return;var maxW=el.clientWidth;if(!maxW)return;var size=28;el.style.fontSize=size+"px";while(el.scrollWidth>maxW&&size>12){size-=1;el.style.fontSize=size+"px";}}
function countUpValue(el,target,prefix){if(!el)return;prefix=prefix||"";var start=performance.now();var dur=1100;var targetNum=+target||0;function step(now){var t=Math.min(1,(now-start)/dur);var eased=1-Math.pow(1-t,3);el.textContent=prefix+(targetNum*eased).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});if(t<1)requestAnimationFrame(step);else{el.textContent=prefix+targetNum.toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});fitKpiValue(el);}}requestAnimationFrame(step);}
function clientInitials(name){var s=String(name||"").trim();if(!s)return "?";var parts=s.split(/\s+/);if(parts.length===1)return parts[0].slice(0,2).toUpperCase();return (parts[0][0]+parts[parts.length-1][0]).toUpperCase();}
function clientAvatar(name){var palettes=["#f06a6a","#66b0ee","#56d488","#e8b854","#a889e8","#f4a271","#5ccfe6","#b8e986"];var hash=0;var s=String(name||"");for(var i=0;i<s.length;i++)hash=((hash<<5)-hash)+s.charCodeAt(i);hash=Math.abs(hash);var c1=palettes[hash%palettes.length];var c2=palettes[(hash+3)%palettes.length];return '<div class="client-av" style="background:linear-gradient(135deg,'+c1+','+c2+');">'+esc(clientInitials(name))+'</div>';}
function defaultAccounts(){return [["1000","Cash","Asset",0],["1010","Bank","Asset",0],["1100","Accounts Receivable","Asset",0],["1200","Inventory","Asset",0],["1500","Fixed Assets","Asset",0],["2000","Accounts Payable","Liability",0],["2100","Tax Payable","Liability",0],["2200","Salaries Payable","Liability",0],["3000","Owner Equity","Equity",0],["3100","Retained Earnings","Equity",0],["4000","Sales Revenue","Revenue",0],["4100","Service Revenue","Revenue",0],["5000","COGS","Expense",0],["6000","Salaries Expense","Expense",0],["6100","Rent Expense","Expense",0],["6200","Utilities","Expense",0],["6300","Marketing","Expense",0],["6400","Office Supplies","Expense",0],["6900","Miscellaneous","Expense",0]].map(function(a){return {code:a[0],name:a[1],type:a[2],parent:"",opening:a[3],balance:a[3]};});}
function defaultTaxCodes(){return [{id:"TX-001",name:"GST 17%",rate:17,desc:"Standard GST"},{id:"TX-002",name:"GST 5%",rate:5,desc:"Reduced GST"},{id:"TX-003",name:"Zero Rated",rate:0,desc:"Zero rated"},{id:"TX-004",name:"Exempt",rate:0,desc:"Exempt"}];}
function defaultDB(){return {config:{companyName:"Your Company",companyEmail:"you@company.com",taxRatePct:10,currency:"PKR",senderName:"",senderEmail:"",defaultSubject:"Invoice {invoice_id} from {company_name}",defaultBody:"Dear {client},\n\nPlease find attached invoice {invoice_id} for {amount}.\n\nDue Date: {due_date}\nStatus: {status}\n\nThank you for your business.\n\nBest regards,\n{company_name}"},invoices:[],clients:[],products:[],vendors:[],expenses:[],estimates:[],creditNotes:[],accounts:defaultAccounts(),journal:[],employees:[],payroll:[],bankTxn:[],payments:[],emailLog:[],salesReceipts:[],purchaseOrders:[],bills:[],billPayments:[],vendorCredits:[],recurring:[],taxCodes:defaultTaxCodes(),timeEntries:[],budgets:[],statements:[]};}
var DB=(function(){try{var r=localStorage.getItem(STORE_KEY);if(r){var p=JSON.parse(r);var b=defaultDB();var m=Object.assign(b,p);m.config=Object.assign(b.config,p.config||{});if(!Array.isArray(m.accounts)||!m.accounts.length)m.accounts=defaultAccounts();if(!Array.isArray(m.taxCodes)||!m.taxCodes.length)m.taxCodes=defaultTaxCodes();["emailLog","salesReceipts","purchaseOrders","bills","billPayments","vendorCredits","recurring","timeEntries","budgets","statements","payments"].forEach(function(k){if(!Array.isArray(m[k]))m[k]=[];});return m;}}catch(e){}return defaultDB();})();
var saveT;function saveDB(){clearTimeout(saveT);saveT=setTimeout(function(){try{localStorage.setItem(STORE_KEY,JSON.stringify(DB));}catch(e){}},60);}
var $=function(s){return document.querySelector(s);};
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");}
function safeNum(v){var n=parseFloat(String(v).replace(/,/g,""));if(!isFinite(n))return 0;return Math.max(-1e15,Math.min(1e15,n));}
function money(v){return (DB.config.currency||"PKR")+" "+safeNum(v).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});}
function moneyShort(v){var n=safeNum(v);var c=DB.config.currency||"PKR";if(Math.abs(n)>=1000000)return c+" "+(n/1000000).toFixed(2)+"M";if(Math.abs(n)>=1000)return c+" "+(n/1000).toFixed(1)+"k";return c+" "+n.toFixed(0);}
function num2(v){return safeNum(v).toLocaleString("en-US",{maximumFractionDigits:2});}
function todayISO(d){d=d||new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function addDaysISO(n){var d=new Date();d.setDate(d.getDate()+n);return todayISO(d);}
function nowStamp(){var d=new Date();return d.toISOString().slice(0,19).replace("T"," ");}
function nextId(prefix,rows,key){key=key||"id";var max=0;(rows||[]).forEach(function(r){var id=String(r[key]||"");if(id.indexOf(prefix+"-")===0){var m=id.slice(prefix.length+1).match(/^\d+/);if(m){var n=parseInt(m[0],10);if(n>max&&n<999999999)max=n;}}});return prefix+"-"+String(max+1).padStart(3,"0");}
function taxRate(){return safeNum(DB.config.taxRatePct)/100;}
function currency(){return DB.config.currency||"PKR";}
function greeting(){var h=new Date().getHours();if(h<12)return"Good morning";if(h<17)return"Good afternoon";if(h<21)return"Good evening";return"Good night";}
function matchSearch(){if(!state.search)return true;var q=state.search.toLowerCase();return Array.prototype.slice.call(arguments).some(function(v){return String(v==null?"":v).toLowerCase().indexOf(q)!==-1;});}
function statusPill(st){var cls=st==="Paid"?"sent":st==="Overdue"?"failed":st==="Partial"?"Partial":st==="Active"?"sent":st==="Inactive"?"failed":st==="Received"?"Partial":st==="Open"?"Partial":st==="Sent"?"new":st==="Draft"?"new":"new";return '<span class="status-pill '+cls+'">'+esc((st||"").toUpperCase())+'</span>';}
function sumAll(){return DB.invoices.reduce(function(t,i){return i.status==="Draft"?t:t+safeNum(i.total);},0);}
function sumByStatus(st){return DB.invoices.filter(function(i){return i.status===st;}).reduce(function(t,i){return t+safeNum(i.total);},0);}
function sumExpenses(){return DB.expenses.reduce(function(t,e){return t+safeNum(e.total);},0);}
function sumVendorBalance(){return DB.vendors.reduce(function(t,v){return t+safeNum(v.balance);},0);}
function getInvoicePaid(id){return DB.payments.filter(function(p){return p.invoiceId===id;}).reduce(function(t,p){return t+safeNum(p.amount);},0);}
function updateInvoiceStatusFromPayments(id){var inv=DB.invoices.find(function(i){return i.id===id;});if(!inv)return;if(inv.status==="Draft")return;var t=safeNum(inv.total),p=getInvoicePaid(id);if(p>=t-0.01){inv.status="Paid";return;}if(p>0){inv.status="Partial";return;}inv.status=(inv.dueDate&&inv.dueDate<todayISO())?"Overdue":"Pending";}
function updateAccountBalance(code,delta){var a=DB.accounts.find(function(x){return x.code===code;});if(a)a.balance=safeNum(a.balance)+delta;}
function calcIncomeTax(m){var a=m*12;var t=0;if(a<=600000)t=0;else if(a<=1200000)t=(a-600000)*.05;else if(a<=2200000)t=30000+(a-1200000)*.15;else if(a<=3200000)t=180000+(a-2200000)*.25;else if(a<=4100000)t=430000+(a-3200000)*.30;else t=700000+(a-4100000)*.35;return t/12;}
function fillPlaceholders(template,ctx){return String(template||"").replace(/\{(\w+)\}/g,function(m,k){return ctx[k]!==undefined?ctx[k]:m;});}
function buildInvoiceContext(inv){var client=DB.clients.find(function(c){return c.name.toLowerCase()===String(inv.client).toLowerCase();})||{};return {invoice_id:inv.id,client:inv.client,client_email:client.email||"",date:inv.date,due_date:inv.dueDate,status:inv.status,amount:money(inv.total),subtotal:money(inv.subtotal),tax:money(inv.tax),currency:currency(),company_name:DB.config.companyName,company_email:DB.config.companyEmail,sender_name:DB.config.senderName||DB.config.companyName,sender_email:DB.config.senderEmail||DB.config.companyEmail,notes:inv.notes||""};}
function generateEmailId(){var stamp=new Date().toISOString().slice(0,19).replace(/[-:T]/g,"");return "EML-"+stamp.slice(0,14);}

async function quickRecordPayment(invId){var inv=DB.invoices.find(function(i){return i.id===invId;});if(!inv)return;if(inv.status==="Draft"){alertBox("Pehle invoice ko finalize karein, phir payment record karein.","Draft");return;}var paid=getInvoicePaid(invId);var bal=safeNum(inv.total)-paid;if(bal<=0.01){alertBox("Already paid","Record");return;}var r=await formModal("Payment — "+invId,[{key:"date",label:"Date",value:todayISO()},{key:"amount",label:"Balance: "+money(bal),value:bal.toFixed(2)},{key:"method",label:"Method",type:"select",value:"Cash",options:["Cash","Bank","Cheque","Card"]}],"Record");if(!r)return;var amt=safeNum(r.amount);if(amt<=0||amt>bal+0.01){alertBox("Invalid","Error");return;}var payId=nextId("PAY",DB.payments);DB.payments.push({id:payId,date:r.date,invoiceId:invId,client:inv.client,amount:amt,method:r.method});updateInvoiceStatusFromPayments(invId);saveDB();render();toast("Recorded",payId,"green");}
async function recordPayment(){var r=await formModal("Record Payment",[{key:"invoiceId",label:"Invoice ID",value:"",required:true,placeholder:"INV-001"}],"Continue");if(!r)return;var inv=DB.invoices.find(function(i){return i.id.toLowerCase()===r.invoiceId.toLowerCase().trim();});if(!inv){alertBox("Not found","Error");return;}await quickRecordPayment(inv.id);}
async function paymentActions(payId){if(await confirmBox("Delete?","Delete")){var p=DB.payments.find(function(x){return x.id===payId;});DB.payments=DB.payments.filter(function(x){return x.id!==payId;});if(p)updateInvoiceStatusFromPayments(p.invoiceId);saveDB();render();toast("Deleted",payId,"red");}}
function nextInvoiceId(){var max=DB.config.invoiceSeq||0;DB.invoices.forEach(function(i){var m=String(i.id||"").match(/^INV-(\d+)$/);if(m)max=Math.max(max,parseInt(m[1],10));});DB.config.invoiceSeq=max+1;return "INV-"+String(max+1).padStart(3,"0");}
function newInvoice(){invoiceEditor(null);}
function r2(n){return Math.round((Number(n)||0)*100)/100;}
function computeInvoiceTotals(items){var subtotal=0,tax=0;var lines=(items||[]).map(function(it){var qty=safeNum(it.qty),rate=safeNum(it.rate),tr=safeNum(it.taxRate);var amount=r2(qty*rate);var t=r2(amount*tr/100);subtotal+=amount;tax+=t;return {desc:String(it.desc||""),qty:qty,rate:rate,taxId:it.taxId||"",taxRate:tr,amount:amount,tax:t};});subtotal=r2(subtotal);tax=r2(tax);return {items:lines,subtotal:subtotal,tax:tax,total:r2(subtotal+tax)};}
function refreshInvoiceStatuses(){DB.invoices.forEach(function(i){if(i.status!=="Draft")updateInvoiceStatusFromPayments(i.id);});}
function ieRowHtml(l,i,codes){var opts=codes.map(function(t){return '<option value="'+esc(t.id)+'"'+(t.id===l.taxId?' selected':'')+'>'+esc(t.name)+'</option>';}).join("")+'<option value=""'+(codes.some(function(t){return t.id===l.taxId;})?'':' selected')+'>Custom</option>';return '<tr>'+'<td><input data-f="desc" data-i="'+i+'" value="'+esc(l.desc)+'" placeholder="Service or product" style="width:100%;"></td>'+'<td style="width:80px;"><input data-f="qty" data-i="'+i+'" type="number" min="0" step="any" value="'+esc(l.qty)+'" style="width:100%;text-align:right;"></td>'+'<td style="width:110px;"><input data-f="rate" data-i="'+i+'" type="number" min="0" step="0.01" value="'+esc(l.rate)+'" style="width:100%;text-align:right;"></td>'+'<td style="width:150px;"><select data-f="taxId" data-i="'+i+'" style="width:100%;">'+opts+'</select><input data-f="taxRate" data-i="'+i+'" type="number" min="0" step="0.01" value="'+esc(l.taxRate)+'" style="width:100%;margin-top:4px;text-align:right;"></td>'+'<td style="width:120px;text-align:right;" data-amt="'+i+'">0.00</td>'+'<td style="width:36px;"><button class="btn ghost" data-f="remove" data-i="'+i+'" title="Remove line" style="height:26px;padding:0 8px;">✕</button></td></tr>';}
function invoiceEditor(invId){
  var inv=invId?DB.invoices.find(function(i){return i.id===invId;}):null;
  if(invId&&!inv){toast("Not found",invId,"red");return;}
  var codes=(DB.taxCodes&&DB.taxCodes.length)?DB.taxCodes:defaultTaxCodes();
  var dflt=codes[0];
  var status=inv?inv.status:"Draft";
  var wasDraft=!inv||status==="Draft";
  var lines;
  if(inv&&Array.isArray(inv.items)&&inv.items.length){lines=inv.items.map(function(it){return {desc:it.desc,qty:it.qty,rate:it.rate,taxId:it.taxId||"",taxRate:it.taxRate};});}
  else if(inv){var oldSub=safeNum(inv.subtotal);lines=[{desc:inv.notes||"Services",qty:1,rate:oldSub,taxId:"",taxRate:oldSub>0?r2(safeNum(inv.tax)/oldSub*100):0}];}
  else{lines=[{desc:"",qty:1,rate:0,taxId:dflt.id,taxRate:dflt.rate}];}
  var draftBtn=(inv&&status!=="Draft")?'':'<button class="btn blue" data-ie="draft">Save as Draft</button>';
  var finalLabel=(inv&&status!=="Draft")?"Save Changes":"Save & Finalize";
  var ov=openModal('<style>.ie input,.ie select,.ie textarea{height:30px;padding:0 8px;border-radius:6px;background:var(--panel);border:1px solid var(--border);color:var(--text);font-family:inherit;font-size:12px;}.ie textarea{height:64px;padding:6px 8px;}.ie td{padding:6px 4px;vertical-align:top;font-size:12px;}.ie th{font-size:10px;letter-spacing:1px;color:var(--muted);text-align:left;padding:6px 4px;text-transform:uppercase;}</style>'
    +'<div class="modal-title">'+(inv?'Edit '+esc(inv.id):'New Invoice')+(inv?' <span style="font-size:11px;color:var(--muted);font-weight:600;margin-left:6px;">'+esc(status)+'</span>':'')+'</div>'
    +'<div class="modal-body ie" style="min-width:min(780px,90vw);">'
    +'<div class="row" style="gap:12px;"><label class="field grow" style="min-width:200px;"><span>Customer</span><input id="ie_client" list="ie_clients" value="'+esc(inv?inv.client:"")+'" placeholder="Customer name"><datalist id="ie_clients">'+DB.clients.map(function(c){return '<option value="'+esc(c.name)+'">';}).join("")+'</datalist></label>'
    +'<label class="field" style="width:150px;"><span>Invoice date</span><input id="ie_date" type="date" value="'+esc(inv?inv.date:todayISO())+'"></label>'
    +'<label class="field" style="width:150px;"><span>Due date</span><input id="ie_due" type="date" value="'+esc(inv?inv.dueDate:addDaysISO(30))+'"></label></div>'
    +'<table style="width:100%;border-collapse:collapse;margin-top:6px;"><thead><tr><th>Description</th><th style="text-align:right;">Qty</th><th style="text-align:right;">Rate</th><th>Tax</th><th style="text-align:right;">Amount</th><th></th></tr></thead><tbody id="ie_lines"></tbody></table>'
    +'<button class="btn ghost" data-ie="addline" style="margin-top:10px;">+ Add line</button>'
    +'<div style="margin-top:14px;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;"><label class="field grow" style="min-width:240px;"><span>Notes / memo</span><textarea id="ie_notes">'+esc(inv?inv.notes||"":"")+'</textarea></label><div id="ie_totals" style="min-width:260px;"></div></div>'
    +'</div><div class="modal-actions"><button class="btn ghost" data-ie="cancel">Cancel</button>'+draftBtn+'<button class="btn green" data-ie="final">'+finalLabel+'</button></div>',{width:840});
  var tbody=ov.querySelector("#ie_lines");
  function recalc(){var t=computeInvoiceTotals(lines);t.items.forEach(function(l,i){var c=ov.querySelector('[data-amt="'+i+'"]');if(c)c.textContent=money(l.amount);});var paid=inv?getInvoicePaid(inv.id):0;ov.querySelector("#ie_totals").innerHTML='<div style="display:flex;justify-content:space-between;padding:6px 0;"><span>Subtotal</span><span>'+esc(money(t.subtotal))+'</span></div><div style="display:flex;justify-content:space-between;padding:6px 0;"><span>Tax</span><span>'+esc(money(t.tax))+'</span></div><div class="total-strip amber" style="height:auto;padding:10px 14px;margin-top:6px;"><div style="flex:1;">Total</div><div>'+esc(money(t.total))+'</div></div>'+(paid>0?'<div style="display:flex;justify-content:space-between;padding:6px 0;color:var(--muted);"><span>Already paid</span><span>'+esc(money(paid))+'</span></div><div style="display:flex;justify-content:space-between;padding:6px 0;font-weight:700;"><span>Balance due</span><span>'+esc(money(Math.max(0,t.total-paid)))+'</span></div>':'');}
  function redraw(){tbody.innerHTML=lines.map(function(l,i){return ieRowHtml(l,i,codes);}).join("");recalc();}
  function ieSave(finalize){
    var client=(ov.querySelector("#ie_client").value||"").trim();
    var date=ov.querySelector("#ie_date").value;var due=ov.querySelector("#ie_due").value;
    var notes=(ov.querySelector("#ie_notes").value||"").trim();
    if(!client){alertBox("Customer ka naam zaroori hai.","Missing");return;}
    if(!date){alertBox("Invoice date zaroori hai.","Missing");return;}
    if(!due||due<date){alertBox("Due date invoice date ke baad honi chahiye.","Invalid");return;}
    for(var k=0;k<lines.length;k++){var l=lines[k];
      if(!String(l.desc||"").trim()){alertBox("Line "+(k+1)+" ki description likhein.","Missing");return;}
      if(!(safeNum(l.qty)>0)){alertBox("Line "+(k+1)+" ki quantity 0 se zyada honi chahiye.","Invalid");return;}
      if(safeNum(l.rate)<0){alertBox("Line "+(k+1)+" ka rate manfi nahi ho sakta.","Invalid");return;}
      if(safeNum(l.taxRate)<0){alertBox("Line "+(k+1)+" ka tax rate manfi nahi ho sakta.","Invalid");return;}}
    var t=computeInvoiceTotals(lines);
    if(finalize&&t.total<=0){alertBox("Final invoice ka total 0 se zyada hona chahiye.","Invalid");return;}
    var paid=inv?getInvoicePaid(inv.id):0;
    if(inv&&t.total<paid-0.01){alertBox("Total cannot be less than the "+money(paid)+" already paid.","Invalid");return;}
    if(!DB.clients.some(function(c){return c.name.toLowerCase()===client.toLowerCase();})){DB.clients.push({id:nextId("CL",DB.clients),name:client,city:"",email:"",phone:"",ntn:""});}
    var id=inv?inv.id:nextInvoiceId();
    var newStatus=inv?inv.status:"Draft";
    if(finalize&&newStatus==="Draft")newStatus="Pending";
    var data={id:id,client:client,date:date,dueDate:due,status:newStatus,items:t.items,subtotal:t.subtotal,tax:t.tax,total:t.total,notes:notes};
    if(inv){Object.assign(inv,data);}else{DB.invoices.push(data);}
    if(data.status!=="Draft")updateInvoiceStatusFromPayments(id);
    saveDB();closeModal(ov);render();
    toast(finalize?"Invoice saved":"Draft saved",id,"green");
    if(finalize&&wasDraft&&isGmailConnected()){confirmBox("Is invoice ko email par bhejna chahte hain?","Send email").then(function(y){if(y)emailComposer(id);});}
  }
  ov.addEventListener("input",function(e){var el=e.target;if(!el.dataset||el.dataset.f===undefined)return;var f=el.dataset.f;if(f==="taxId")return;var i=+el.dataset.i;if(!lines[i])return;lines[i][f]=el.value;if(f==="taxRate"){lines[i].taxId="";var sel=el.closest("tr").querySelector('select[data-f="taxId"]');if(sel)sel.value="";}recalc();});
  ov.addEventListener("change",function(e){var el=e.target;if(!el.dataset||el.dataset.f!=="taxId")return;var i=+el.dataset.i;lines[i].taxId=el.value;var code=codes.find(function(t){return t.id===el.value;});if(code){lines[i].taxRate=code.rate;var rate=el.closest("tr").querySelector('[data-f="taxRate"]');if(rate)rate.value=code.rate;}recalc();});
  ov.addEventListener("click",function(e){var b=e.target.closest("[data-f='remove'],[data-ie]");if(!b)return;
    if(b.dataset.f==="remove"){if(lines.length>1){lines.splice(+b.dataset.i,1);redraw();}else{alertBox("Invoice mein kam az kam ek line honi chahiye.","Lines");}return;}
    var act=b.dataset.ie;
    if(act==="addline"){lines.push({desc:"",qty:1,rate:0,taxId:dflt.id,taxRate:dflt.rate});redraw();return;}
    if(act==="cancel"){closeModal(ov);return;}
    if(act==="draft"){ieSave(false);return;}
    if(act==="final"){ieSave(true);return;}
  });
  redraw();
}

async function billActions(id){var b=DB.bills.find(function(x){return x.id===id;});if(!b)return;var bal=safeNum(b.total)-safeNum(b.paid);var choice=await actionSheet("Bill "+id+" — "+b.vendor+" — "+money(bal)+" due",[{label:"Record Payment",value:"P",cls:"green"},{label:"Mark Paid",value:"M",cls:"green"},{label:"Delete",value:"D",cls:"red"}]);if(!choice)return;if(choice==="P"){var r=await formModal("Pay Bill",[{key:"amount",label:"Amount",value:bal.toFixed(2)},{key:"date",label:"Date",value:todayISO()},{key:"method",label:"Method",type:"select",value:"Bank",options:["Cash","Bank","Cheque"]}],"Pay");if(!r)return;var amt=safeNum(r.amount);if(amt<=0||amt>bal+0.01)return;var payId=nextId("BP",DB.billPayments);DB.billPayments.push({id:payId,billId:id,vendor:b.vendor,date:r.date,amount:amt,method:r.method});b.paid=safeNum(b.paid)+amt;b.status=b.paid>=safeNum(b.total)-0.01?"Paid":"Partial";saveDB();render();toast("Paid",payId,"green");}else if(choice==="M"){b.paid=safeNum(b.total);b.status="Paid";saveDB();render();toast("Marked paid",id,"green");}else if(await confirmBox("Delete?","Delete")){DB.bills=DB.bills.filter(function(x){return x.id!==id;});saveDB();render();toast("Deleted",id,"red");}}

function importBankCSV(){var input=document.createElement("input");input.type="file";input.accept=".csv";input.onchange=function(){var file=input.files&&input.files[0];if(!file)return;var reader=new FileReader();reader.onload=function(ev){var text=String(ev.target.result||"");var lines=text.split(/\r?\n/).filter(function(l){return l.trim().length;});var count=0;for(var i=1;i<lines.length;i++){var parts=lines[i].split(",");if(parts.length>=4){DB.bankTxn.push({id:"BT-"+String(DB.bankTxn.length+1).padStart(4,"0"),date:parts[0].trim(),description:parts[1].trim(),debit:safeNum(parts[2]),credit:safeNum(parts[3]),balance:0,status:"Pending"});count++;}}saveDB();render();toast("Imported",count+" rows","green");};reader.readAsText(file);};input.click();}

ont-size:13px;">'+esc(inv.id)+'</div></div></div>'+'<div class="meta"><div><b>Bill to</b><br>'+esc(inv.client)+'</div><div style="text-align:right;"><b>Invoice date</b> '+esc(inv.date)+'<br><b>Due date</b> '+esc(inv.dueDate)+'</div></div>'+'<table><thead><tr><th>Description</th><th style="text-align:right;">Qty</th><th style="text-align:right;">Rate</th><th style="text-align:right;">Tax</th><th style="text-align:right;">Amount</th></tr></thead><tbody>'+rows+'</tbody></table>'+'<div class="tot-wrap"><div class="tot"><span>Subtotal</span><span>'+t.subtotal.toFixed(2)+'</span></div><div class="tot"><span>Tax</span><span>'+t.tax.toFixed(2)+'</span></div><div class="tot big"><span>Total</span><span>'+esc(currency())+' '+t.total.toFixed(2)+'</span></div>'+(paid>0?'<div class="tot"><span>Paid</span><span>'+paid.toFixed(2)+'</span></div><div class="tot big"><span>Balance due</span><span>'+esc(currency())+' '+bal.toFixed(2)+'</span></div>':'')+'</div>'+(inv.notes?'<div class="notes">'+esc(inv.notes)+'</div>':'')+'</body></html>';var w=window.open("","_blank","width=820,height=1000");if(!w){alertBox("Pop-up blocked. Browser mein pop-ups allow karein.","PDF");return;}w.document.open();w.document.write(html);w.document.close();setTimeout(function(){w.focus();w.print();},400);toast("PDF ready",invId,"blue");}
function download(filename,content,mime){var blob=new Blob([content],{type:(mime||"text/csv")+";charset=utf-8"});var url=URL.createObjectURL(blob);var a=document.createElement("a");a.href=url;a.download=filename;document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(url);a.remove();},400);}
function csvEsc(s){s=String(s==null?"":s);if(s.indexOf(",")!==-1||s.indexOf('"')!==-1||s.indexOf("\n")!==-1)return '"'+s.replace(/"/g,'""')+'"';return s;}
function toCSV(rows){return rows.map(function(r){return r.map(csvEsc).join(",");}).join("\r\n");}
function exportSheetCSV(which){var maps={invoices:{file:"Velora_Invoices",rows:DB.invoices,cols:["ID","Client","Date","DueDate","Status","Subtotal","Tax","Total"],row:function(i){return [i.id,i.client,i.date,i.dueDate,i.status,i.subtotal,i.tax,i.total];}},clients:{file:"Velora_Customers",rows:DB.clients,cols:["ID","Name","City","Email","Phone"],row:function(c){return [c.id,c.name,c.city,c.email,c.phone];}},vendors:{file:"Velora_Vendors",rows:DB.vendors,cols:["ID","Name","City","Email","Phone","Balance"],row:function(v){return [v.id,v.name,v.city,v.email,v.phone,v.balance];}},products:{file:"Velora_Products",rows:DB.products,cols:["ID","Name","Rate","Cost","Stock"],row:function(p){return [p.id,p.name,p.rate,p.cost,p.stock];}},expenses:{file:"Velora_Expenses",rows:DB.expenses,cols:["ID","Date","Category","Vendor","Amount","Tax","Total"],row:function(e){return [e.id,e.date,e.category,e.vendor,e.amount,e.tax,e.total];}},bills:{file:"Velora_Bills",rows:DB.bills,cols:["ID","Vendor","Date","DueDate","Status","Total","Paid"],row:function(b){return [b.id,b.vendor,b.date,b.dueDate,b.status,b.total,b.paid];}}};var m=maps[which];if(!m)return;if(!m.rows.length){alertBox("No data","Export");return;}var csv=[m.cols].concat(m.rows.map(m.row));download(m.file+"_"+todayISO().replace(/-/g,"")+".csv",toCSV(csv));toast("Exported",m.file,"green");}

function restoreFile(){var input=document.createElement("input");input.type="file";input.accept=".json";input.onchange=function(){var file=input.files&&input.files[0];if(!file)return;var reader=new FileReader();reader.onload=async function(ev){try{var parsed=JSON.parse(ev.target.result);if(!parsed||typeof parsed!=="object")throw new Error("Invalid");if(!(await confirmBox("Replace data?","Restore")))return;var base=defaultDB();DB=Object.assign(base,parsed);DB.config=Object.assign(base.config,parsed.config||{});if(!Array.isArray(DB.accounts)||!DB.accounts.length)DB.accounts=defaultAccounts();["emailLog","salesReceipts","purchaseOrders","bills","billPayments","vendorCredits","recurring","timeEntries","budgets","statements"].forEach(function(k){if(!Array.isArray(DB[k]))DB[k]=[];});saveDB();render();toast("Restored","","green");}catch(err){toast("Failed",err.message,"red");}};reader.readAsText(file);};input.click();}
async function editCompany(){var r=await formModal("Company Info",[{key:"name",label:"Name",value:DB.config.companyName,required:true},{key:"email",label:"Email",value:DB.config.companyEmail},{key:"senderName",label:"Sender",value:DB.config.senderName||""},{key:"senderEmail",label:"Reply-To",value:DB.config.senderEmail||""}],"Save");if(!r)return;DB.config.companyName=r.name.trim();DB.config.companyEmail=r.email.trim();DB.config.senderName=r.senderName.trim();DB.config.senderEmail=r.senderEmail.trim();saveDB();render();toast("Saved","","green");}
async function editTax(){var r=await formModal("Tax Rate",[{key:"rate",label:"Tax Rate (%)",value:DB.config.taxRatePct}],"Save");if(!r)return;var v=safeNum(r.rate);if(v<0)v=0;if(v>100)v=100;DB.config.taxRatePct=v;saveDB();render();toast("Updated",num2(v)+"%","green");}
async function editCurrency(){var r=await formModal("Currency",[{key:"currency",label:"Currency",type:"select",value:DB.config.currency,options:["PKR","INR","USD","AED","SAR","GBP","EUR"]}],"Save");if(!r)return;DB.config.currency=(r.currency||"PKR").toUpperCase();saveDB();render();toast("Updated",DB.config.currency,"green");}
function viewRawData(){var json=JSON.stringify(DB,null,2);var ov=openModal('<div class="modal-title">Raw Data</div><div class="modal-body"><textarea class="mono" readonly>'+esc(json)+'</textarea></div><div class="modal-actions"><button class="btn ghost" data-close>Close</button></div>',{width:Math.min(720,window.innerWidth-40)});ov.querySelector("[data-close]").onclick=function(){closeModal(ov);};}
async function resetAll(){if(!(await confirmBox("DELETE ALL DATA?","Reset")))return;if(!(await confirmBox("Final?","Reset")))return;var keep=Object.assign({},DB.config);DB=defaultDB();DB.config=keep;state.search="";state.page="Dashboard";state.subPage="";saveDB();render();toast("Reset","","red");}
(function handleOAuthReturn(){if(window.location.hash&&window.location.hash.indexOf("#connected=")===0){try{var data=JSON.parse(decodeURIComponent(window.location.hash.slice(11)));if(!data.tokens){toast("Failed","No tokens","red");history.replaceState(null,"",window.location.pathname);return;}if(data.tokens.error){toast("Error",data.tokens.error,"red");history.replaceState(null,"",window.location.pathname);return;}if(!data.tokens.access_token){toast("Failed","No token","red");history.replaceState(null,"",window.location.pathname);return;}setGmailTokens(data);history.replaceState(null,"",window.location.pathname);setTimeout(function(){toast("Gmail connected! 🎉",data.email||"","green");render();},600);}catch(e){toast("Failed",String(e.message||e),"red");history.replaceState(null,"",window.location.pathname);}}})();
(function init(){if(!DB.accounts||!DB.accounts.length)DB.accounts=defaultAccounts();if(!Array.isArray(DB.emailLog))DB.emailLog=[];saveDB();applyThemePrefs();initOnboarding();render();})();
</script>
